/* ---------- données : chapitres (d'après le document Word du cours uniquement) ---------- */
const CH=[
{id:1,t:"La monnaie : fonctions et création",html:`
<p class="lead">Les rappels indispensables : à quoi sert la monnaie, qui la crée, et jusqu’où.</p>
<div class="callout"><b>Évaluation.</b> 2 DS : un sur le chapitre 1, un sur le chapitre 2, avec des questions à réponse courte. Puis un examen de 1 h 30, plus développé. Il faut savoir <b>expliquer la logique</b> de chaque mécanisme.</div>
<h3>Plan du cours</h3>
<ul><li>I. La fonction économique des banques : différentes approches (standard et post-keynésienne)</li><li>II. L’industrie bancaire : ses transformations, ses enjeux</li><li>III. La contribution du système bancaire et financier à l’instabilité économique</li></ul>
<h3>Les trois fonctions de la monnaie</h3>
<div class="tablebox"><table><tr><th>Fonction</th><th>À retenir</th></tr>
<tr><td>Unité de compte</td><td>Étalon commun qui exprime la valeur des biens.</td></tr>
<tr><td>Réserve de valeur</td><td>On peut épargner en monnaie. Bonne réserve car c’est l’actif le plus <b>liquide</b> : la liquidité est la facilité et la rapidité avec laquelle un actif se transforme en monnaie.</td></tr>
<tr><td>Intermédiaire des échanges</td><td>Évite la <b>double coïncidence des besoins</b> du troc, rend l’échange moins coûteux. Elle règle aussi des transactions sans échange (impôts) : c’est un <b>moyen de paiement</b>.</td></tr></table></div>
<p>La fonction que l’on met en avant change la façon de comprendre le rôle des banques.</p>
<h3>Qui crée la monnaie ?</h3>
<ul><li><b>La BCE</b> crée la <b>monnaie centrale</b> : monopole des billets (monnaie fiduciaire) et monnaie scripturale. Seules les banques commerciales ont un compte à la BCE ; les particuliers n’ont pas accès à la monnaie centrale scripturale.</li>
<li><b>Les banques commerciales</b> créent la <b>monnaie bancaire</b>, uniquement scripturale (elles ne peuvent plus émettre de billets), « à partir de rien », par une simple écriture lors d’un crédit.</li>
<li><b>« Les crédits font les dépôts »</b> : le crédit vient d’abord, le dépôt en découle. L’<b>initiative</b> de la création monétaire vient des banques commerciales ; la BCE crée ensuite la monnaie centrale nécessaire (billets, paiements interbancaires, réserves).</li></ul>
<div class="tablebox"><table><tr><th>Actif de la banque</th><th>Passif de la banque</th></tr><tr><td>Crédit à l’entreprise : + 1 000 €</td><td>Dépôt à vue de l’entreprise : + 1 000 €</td></tr></table></div>
<p>Exemple illustratif : le dépôt n’existait pas avant le crédit, 1 000 € de monnaie sont créés.</p>
<h3>Trois usages de cette monnaie</h3>
<ol><li><b>Retirer des espèces</b> : la banque emprunte des billets à la BCE, ou utilise les dépôts d’autres clients.</li>
<li><b>Payer un client de la même banque</b> : simple jeu d’écritures.</li>
<li><b>Payer un client d’une autre banque</b> : la banque règle en <b>monnaie centrale</b>.</li></ol>
<h3>Le circuit bancaire</h3>
<p>La monnaie bancaire ne circule qu’entre les clients d’une même banque (le <b>circuit bancaire</b>). Pour en sortir, elle est détruite et remplacée par un transfert de monnaie centrale. D’où l’intérêt d’une <b>grosse part de marché</b> : moins de monnaie part vers les autres banques.</p>
<h3>La limite de la création monétaire</h3>
<p>C’est l’<b>accès à la monnaie centrale</b>, indispensable pour les retraits et les paiements interbancaires.</p>`},
{id:2,t:"Neutralité de la monnaie",html:`
<p class="lead">Un débat de fond : la monnaie change-t-elle l’économie réelle ?</p>
<div class="tablebox"><table><tr><th></th><th>Monnaie neutre</th><th>Monnaie non neutre (Keynes)</th></tr>
<tr><td>Image</td><td>Une simple étiquette, un « voile »</td><td>Un carburant</td></tr>
<tr><td>Si la masse monétaire double</td><td>Les prix doublent, rien ne change dans l’économie réelle (pas plus d’emplois ni d’usines) : seulement de l’inflation</td><td>Les achats et investissements augmentent : vrais emplois et vraie production, au moins à court terme</td></tr>
<tr><td>Origine de la monnaie</td><td>L’échange</td><td>Le <b>paiement</b> : sa fonction première est de mesurer ce qui est dû et de régler la dette</td></tr></table></div>
<ul><li>La monnaie est <b>non neutre</b> si son intervention modifie les variables réelles (les quantités échangées) ou les désirs des agents.</li>
<li><b>Exemple :</b> une entreprise et ses salariés. Sans monnaie, pas de production : l’entreprise ne peut pas utiliser leur force de travail sans promesse de paie.</li></ul>
<div class="callout">Ce débat prépare l’opposition entre l’approche standard (monnaie neutre, économie d’échange) et l’approche post-keynésienne (monnaie non neutre, économie de production).</div>`},
{id:3,t:"Approche standard : marché et défaillances",html:`
<p class="lead">Dans l’approche standard, la banque n’existe que parce que le marché est imparfait.</p>
<h3>Le marché financier</h3>
<p>Lieu où se rencontrent les <b>agents à capacité de financement</b> (ACF, épargnants) et les <b>agents à besoin de financement</b> (ABF, emprunteurs), qui s’échangent de l’épargne. Son bon fonctionnement repose sur le libre accès et la concurrence.</p>
<h3>La concurrence pure et parfaite (CPP)</h3>
<ol><li><b>Atomicité :</b> très grand nombre d’acheteurs et de vendeurs, aucun n’influence le prix seul.</li>
<li><b>Homogénéité du produit :</b> biens identiques et interchangeables.</li>
<li><b>Fluidité :</b> libre entrée et sortie, sans barrière financière, technique ou réglementaire.</li>
<li><b>Transparence :</b> information totale, gratuite, instantanée.</li>
<li><b>Mobilité des facteurs de production :</b> travail et capital circulent sans contrainte.</li></ol>
<p>En CPP, l’échange est optimal : c’est l’<b>optimum</b>, situation qu’on ne peut améliorer pour un agent sans dégrader celle d’un autre. <b>Dans ce monde, il n’y a pas de banque</b> : tout passe par le marché, et la banque gênerait le libre-échange en influençant les prix.</p>
<h3>Finance directe et finance indirecte</h3>
<div class="formula">Finance directe : ACF ↔ ABF</div>
<div class="formula">Finance indirecte : ACF ↔ intermédiaire financier ↔ ABF</div>
<div class="tablebox"><table><tr><th></th><th>Finance directe</th><th>Finance indirecte</th></tr>
<tr><td>Nom</td><td>Intermédiation <b>hors bilan</b></td><td>Intermédiation <b>de bilan</b></td></tr>
<tr><td>Exemples</td><td>Courtier, trader</td><td>Banque : dépôts et crédits à son bilan</td></tr>
<tr><td>En CPP</td><td>Seule possible</td><td>Impossible</td></tr></table></div>
<h3>Les défaillances de marché</h3>
<p>Nous ne sommes pas en CPP, donc les marchés financiers non plus : les agents se rencontrent dans de mauvaises conditions. Les intermédiaires financiers existent pour pallier ces défaillances.</p>
<ul><li><b>Asymétrie d’information</b> (et <b>aléa moral</b>) : les deux agents n’ont pas les mêmes informations. La banque produit chaque jour de l’information sur son client : elle <b>réduit</b> l’asymétrie, sans l’éliminer.</li>
<li><b>Coûts de transaction :</b> absents en CPP, ils limitent les choix optimaux.</li>
<li><b>Problème de liquidité :</b> les marchés offrent de la liquidité mais ne l’assurent pas parfaitement.</li></ul>`},
{id:4,t:"Approche standard : rôles des banques",html:`
<p class="lead">Ce que fait la banque que le marché ne sait pas faire, et comment ce rôle a évolué.</p>
<h3>1. La transformation des échéances (Gurley et Shaw)</h3>
<p>Les ACF veulent prêter à court terme, les ABF veulent emprunter à moyen et long terme : les marchés seuls ne peuvent pas l’assurer, la banque le fait.</p>
<div class="callout"><b>Risque de ruée bancaire.</b> Si les déposants perdent confiance, ils retirent tous leurs fonds : faillite. La banque doit rester assez liquide et bien choisir à qui elle prête. La menace de ruée la <b>discipline</b>.</div>
<h3>2. La réduction de l’asymétrie d’information (Akerlof)</h3>
<p>Akerlof étudie le marché des voitures d’occasion : on ne sait jamais, avant l’achat, si le vendeur dit vrai. La banque connaît et gère les ressources et les moyens de paiement de ses clients : elle produit de l’information. Elle réduit ainsi le risque de <b>rationnement du crédit</b> et la <b>sélection adverse</b> (prêter à la mauvaise personne).</p>
<h3>3. Le contrôle délégué</h3>
<p>La banque surveille le débiteur <b>au nom des créanciers</b> pendant toute la relation, sans attendre le défaut pour agir. Elle est plus efficace qu’un agent isolé et réalise des <b>économies d’échelle</b> (elle le fait en grande quantité).</p>
<h3>4. La réduction du coût de participation au marché</h3>
<p>Pour un simple agent, aller seul sur le marché serait trop risqué.</p>
<h3>Depuis les années 1980 : pas de désintermédiation</h3>
<p>Les réformes cherchent à se rapprocher de la CPP en favorisant la finance directe. Les marchés ont pris beaucoup d’importance, mais les banques vont elles-mêmes sur les marchés pour leurs clients : <b>pas de désintermédiation</b>. Et rien ne démontre que se rapprocher de la CPP rapproche de l’optimum.</p>
<h3>Les nouveaux rôles des IF (Allen et Santomero)</h3>
<p>Les intermédiaires ne se contentent plus de collecter des dépôts pour accorder des crédits : ils sont spécialistes de la <b>tarification, de la transformation et du transfert des risques</b>.</p>
<ul><li><b>Le négoce des risques :</b> concevoir, acheter, revendre des instruments complexes (dérivés, options, contrats à terme) pour redistribuer les risques.</li>
<li><b>L’accès au marché :</b> ces marchés de dérivés sont des marchés d’intermédiaires, inaccessibles aux investisseurs individuels.</li></ul>
<div class="callout">Le rôle des banques a <b>changé mais ne s’est pas réduit</b> : elles restent un décideur essentiel de l’allocation des ressources.</div>`},
{id:5,t:"Approche post-keynésienne",html:`
<p class="lead">Pour les héritiers de Keynes, la banque est d’abord celle qui crée la monnaie.</p>
<p>L’approche standard oublie ce qui distingue la banque de toute autre institution : le <b>pouvoir de création monétaire</b>. C’est pour cela qu’on a besoin des banques, pas pour échanger des épargnes.</p>
<h3>Économie d’échange ou de production</h3>
<ul><li><b>Économie classique = économie d’échange.</b> Le stock d’épargne est une production antérieure non consommée, une forme réelle.</li>
<li><b>Keynes = économie de production.</b> Quand on produit, il n’y a encore rien à échanger : l’échange vient après la production.</li>
<li><b>Exemple patron / salariés :</b> le patron promet une paie ; pour que la promesse inspire confiance, une institution, la banque, certifie qu’avec cette paie on pourra consommer partout. La banque crée la monnaie que le patron emprunte pour payer les salaires : sans elle, pas de production. Ce n’est donc pas vraiment un échange.</li>
<li>La monnaie est <b>non neutre</b> ; la banque <b>met en route le processus collectif</b> de production en créant une créance (une promesse).</li>
<li>Les IF existent aussi : les agents ne dépensent pas tout leur revenu, une partie de la production n’est pas vendue, il faut investir l’épargne pour compenser.</li></ul>
<h3>Le processus de financement</h3>
<ol class="flow"><li><b>Anticipations des firmes :</b> quelle demande, à quels prix.</li>
<li><b>Plans de production :</b> coûts comparés à la demande, c’est la <b>demande effective</b> ; les entreprises se tournent vers les banques.</li>
<li><b>Crédit :</b> les banques créent la monnaie.</li>
<li><b>Flux de monnaie :</b> elle devient revenu ; une partie est consommée et investie, une partie épargnée.</li>
<li><b>Flux de revenu équivalent :</b> ce qui ne revient pas vers l’entreprise forme ses besoins résiduels ; la banque joue alors son rôle d’IF.</li></ol>
<div class="callout"><b>Rôle premier</b> : création monétaire. <b>Rôle final</b> : intermédiaire financier.</div>
<h3>Conséquences</h3>
<ul><li><b>Offre de monnaie endogène :</b> déterminée par les demandes des agents non bancaires.</li>
<li><b>Rôle passif</b> des banques : ce sont les agents non financiers qui sont à l’origine de la création monétaire.</li>
<li>Le rôle des banques <b>n’est pas lié aux imperfections de marché</b> : la création monétaire n’est pas un processus de marché, la banque fait partie du fonctionnement normal d’une économie de marché, même parfait.</li>
<li>Le rôle d’IF est <b>secondaire</b>, contrairement à l’approche standard.</li></ul>`},
{id:6,t:"Endogénéité de la monnaie et comparatif",html:`
<p class="lead">L’offre de monnaie est-elle totalement endogène ? Désaccord entre post-keynésiens.</p>
<h3>Les horizontalistes</h3>
<p>Offre de monnaie <b>totalement endogène</b> : toutes les demandes solvables et crédibles sont acceptées. La banque est passive, donc pas besoin d’une théorie du comportement des banques : elles répondent aux demandes.</p>
<h3>La critique : la liquidité de la banque</h3>
<ul><li>L’endogénéité totale reviendrait à financer tout ce qui est finançable. En réalité, on regarde la <b>solvabilité</b> et la <b>liquidité</b>. On peut être solvable et illiquide, donc incapable d’honorer une échéance le jour J.</li>
<li>La banque regarde <b>sa propre liquidité</b> : sa monnaie ne circule qu’entre ses clients, et les paiements interbancaires exigent de la <b>monnaie centrale</b> (réserves).</li>
<li>Dès qu’elle crée de la monnaie, elle doit pouvoir se procurer de la monnaie centrale, sinon elle est illiquide. Elle peut refuser un projet solide faute de monnaie centrale.</li>
<li>L’offre de monnaie s’explique par le <b>niveau de la demande</b> et la <b>décision des banques liée à la liquidité</b>.</li></ul>
<h3>Qui fixe quoi ?</h3>
<div class="tablebox"><table><tr><th></th><th>Économie standard</th><th>Horizontalistes</th></tr>
<tr><td>La BC fixe</td><td>La quantité de monnaie</td><td>Le taux d’intérêt</td></tr>
<tr><td>Le marché détermine</td><td>Le taux d’intérêt (selon la demande)</td><td>La quantité de monnaie créée</td></tr></table></div>
<p>Si la quantité est endogène, le prix (le taux d’intérêt) doit être exogène : c’est la BC qui le détermine.</p>
<h3>Le comparatif à savoir refaire</h3>
<div class="tablebox"><table><tr><th>Critère</th><th>Approche standard</th><th>Approche post-keynésienne</th></tr>
<tr><td>Économie</td><td>D’échange</td><td>De production</td></tr>
<tr><td>Rôle principal</td><td>Intermédiaire financier</td><td>Création monétaire</td></tr>
<tr><td>Pourquoi des banques</td><td>Imperfections de marché</td><td>Il faut une monnaie pour lancer la production</td></tr>
<tr><td>En CPP</td><td>Pas de banque</td><td>Toujours des banques</td></tr>
<tr><td>Rôle d’IF</td><td>Central</td><td>Secondaire, final</td></tr>
<tr><td>Monnaie</td><td>Neutre</td><td>Non neutre</td></tr>
<tr><td>Offre de monnaie</td><td>Exogène</td><td>Endogène</td></tr>
<tr><td>Auteurs</td><td>Gurley et Shaw, Akerlof, Allen et Santomero</td><td>Keynes, horizontalistes</td></tr></table></div>`},
{id:7,t:"Du fordisme à la financiarisation",html:`
<p class="lead">Chapitre 2. Trois transformations : la financiarisation, le numérique, la finance verte. La première est essentielle dans les années 1980-1990.</p>
<h3>L’économie fordiste (Trente Glorieuses)</h3>
<ul><li>Pour produire beaucoup, il faut une forte demande, portée par des <b>salaires croissants</b>, permis par de forts <b>gains de productivité</b> sans nuire aux profits. Concurrence faible face à la croissance du marché.</li>
<li>Économie <b>administrée</b> (période keynésienne) : contrôle des changes, <b>limites de crédit</b> imposées aux banques.</li>
<li>Pas de marchés financiers comme aujourd’hui ni de dérivés : financement à court terme auprès des banques. Liquidité très limitée (peu d’intervenants). Une banque très liquide devait déposer au Trésor.</li></ul>
<h3>La crise</h3>
<ol class="flow"><li><b>Fin des années 1960 :</b> les gains de productivité ralentissent, le taux de profit moyen baisse.</li>
<li>Pour continuer à augmenter les salaires, on monte les prix.</li>
<li><b>Années 1970 :</b> l’inflation s’installe, c’est la <b>stagflation</b>. Le mécanisme de croissance n’est plus viable.</li>
<li>La demande intérieure ne suffit plus : on cherche la croissance à l’<b>extérieur</b>, la <b>concurrence</b> s’intensifie (prix ou innovation).</li>
<li>Le salaire devient un <b>coût à réduire</b>, ce qui limite les débouchés.</li>
<li>Solution : des <b>marchés financiers liquides</b> ; le gain en patrimoine soutient la croissance.</li></ol>
<h3>L’effet richesse</h3>
<p>La consommation dépend du revenu, mais c’est aussi une fonction croissante du <b>patrimoine</b>. On peut aussi réduire sa consommation pour augmenter son épargne.</p>
<div class="callout"><b>Paroxysme : les subprimes.</b> On prêtait sans regarder les revenus, en comptant sur la valeur future de la maison. Sans marchés financiers puissants, pas de subprimes : les banques ont <b>titrisé</b> les crédits et les ont vendus sur les marchés.</div>
<h3>Le contexte international et idéologique</h3>
<ul><li>Déséquilibres des balances des paiements, tensions sur les changes fixes, puis abandon des taux fixes. Les pays en déficit doivent attirer des capitaux, les pays en excédent cherchent des placements : il faut des marchés liquides et des produits variés.</li>
<li>La remise en cause des politiques keynésiennes ouvre la porte au <b>néolibéralisme</b> : marchés efficients, donc <b>déréglementation</b> (nouveaux marchés et produits, libre circulation des capitaux, déréglementation bancaire).</li>
<li>Ce mouvement naît dans les années 1980, se renforce dans les années 1990, <b>jusqu’en 2008</b>.</li>
<li>La capitalisation boursière croît vite (hausse de valeur des titres existants), ce qui nourrit l’effet patrimoine. Mais le marché <b>ne s’est pas substitué aux banques</b> autant que voulu.</li></ul>`},
{id:8,t:"Transformations de l’industrie bancaire",html:`
<p class="lead">Ce que la financiarisation a changé pour les banques.</p>
<h3>Plus de concurrence entre IF</h3>
<p>Les marchés bancaires étaient peu concurrentiels : on ne changeait pas de banque. Mesures : simplification du changement de banque, arrivée de banques étrangères et en ligne, extension des activités. Pour la banque de dépôt, la concurrence reste faible.</p>
<h3>Une très forte concentration</h3>
<p>Réduction drastique du nombre de banques (petites régionales). La liberté des marchés empêche la concurrence ; volonté de créer des acteurs massifs.</p>
<h3>Les banques systémiques (too big to fail)</h3>
<ul><li>Si grosses que leur faillite entraînerait tout le système bancaire.</li>
<li><b>Distorsion de concurrence :</b> refinancement moins cher pour les gros établissements.</li>
<li><b>Gains privatisés, pertes socialisées</b> : certains toujours gagnants, d’autres toujours perdants.</li></ul>
<div class="callout"><b>Chiffres à retenir.</b> En 2016, 30 banques systémiques mondiales représentaient 65 % du PIB mondial. Une dépréciation d’environ 5 % de leurs actifs suffisait à absorber leur capital (insolvabilité) : il fallait solliciter BC et gouvernements.</div>
<h3>L’internationalisation</h3>
<p>Favorisée par la libéralisation des capitaux ; elle dépasse largement le commerce de biens et services et suit la balance des paiements. Les banques de dépôt, elles, ne se sont pas internationalisées.</p>
<h3>Essor des activités de marché</h3>
<ul><li>La transformation des échéances décline. On juge l’allocation bancaire inefficiente : on veut passer au financement de marché (mise en concurrence = allocation optimale).</li>
<li>L’intermédiation demeure mais passe davantage par les marchés.</li>
<li>Nouveau : la banque accorde le crédit puis <b>revend la créance</b> (subprimes).</li>
<li><b>Shadow banking :</b> intermédiation financière non bancaire, non réglementée, sans accès direct au refinancement de la BC, mais centrale pour la liquidité des marchés.</li></ul>
<h3>Banques universelles</h3>
<p>Des banques qui font tout. Elles n’existaient pas avant, sauf en Allemagne.</p>`},
{id:9,t:"Numérique et nouvelles monnaies",html:`
<p class="lead">Les activités bancaires sont nécessaires, pas forcément les banques.</p>
<p>Des acteurs qui ne sont pas des banques peuvent jouer des rôles comparables (idée attribuée à Bill Gates dans le cours).</p>
<h3>Fintech et big tech</h3>
<div class="tablebox"><table><tr><th></th><th>Fintech</th><th>Big tech</th></tr>
<tr><td>Définition</td><td>Entreprises innovantes (applis, IA, blockchain) offrant des services financiers plus rapides, accessibles, moins chers</td><td>Grandes entreprises technologiques qui développent la finance (Apple Pay)</td></tr>
<tr><td>Information</td><td>Peu</td><td>Beaucoup</td></tr>
<tr><td>Taille</td><td>Insuffisante face aux banques</td><td>Très grande</td></tr>
<tr><td>Atout</td><td>Agilité : grignotent les activités annexes, fragilisent les banques à terme</td><td>Moins régulées, position favorable</td></tr></table></div>
<h3>Les nouvelles formes monétaires</h3>
<ul><li><b>Monnaie numérique de banque centrale :</b> sera-t-elle accessible au public ? Si oui, elle met en danger les banques.</li>
<li><b>Monnaie numérique privée</b> (bitcoin) et stablecoins : vraie monnaie ou outil spéculatif ? Si c’est une monnaie, elle remet en cause les banques et la BC : l’État perd sa <b>souveraineté monétaire</b>.</li>
<li>Produits de l’<b>innovation technique</b> : pas émises par une BC, processus <b>décentralisé</b>, <b>pas de politique monétaire</b>.</li></ul>
<h3>Le bitcoin est-il une monnaie ?</h3>
<div class="tablebox"><table><tr><th>Si la monnaie est…</th><th>Le bitcoin ?</th></tr>
<tr><td>Une marchandise intermédiaire des échanges</td><td>Non</td></tr>
<tr><td>Un actif financier</td><td>Non : il n’est la dette de personne (même s’il s’échange sur les marchés)</td></tr>
<tr><td>Une institution qui permet les paiements</td><td>Oui, on peut payer avec ; mais est-il assez bien conçu pour concurrencer les monnaies souveraines ?</td></tr></table></div>`}
];

[8,"Qu’est-ce qu’une banque systémique et quel problème pose-t-elle ?","Une banque trop grosse pour faire faillite (too big to fail). Elle crée une distorsion de concurrence (refinancement moins cher) et ses pertes sont socialisées alors que ses gains sont privatisés. En 2016, 30 d’entre elles = 65 % du PIB mondial.",["too big to fail","distorsion","pertes socialisées|socialis","65"]],

const fc={ch:"all",only:false,known:store.get("known",{}),deck:[],i:0,flip:false,
  build(){
    let d=CARDS.filter(c=>fc.ch==="all"||String(c.ch)===fc.ch);
    if(fc.only)d=d.filter(c=>!fc.known[c.id]);
    fc.deck=d;fc.i=0;fc.flip=false;
  }};
function renderCards(){
  const total=fc.deck.length,c=fc.deck[fc.i];
  const knownAll=CARDS.filter(x=>fc.known[x.id]).length;
  const chInDeck=CARDS.filter(x=>fc.ch==="all"||String(x.ch)===fc.ch);
  const knownIn=chInDeck.filter(x=>fc.known[x.id]).length;
  $("#view-connaissances").innerHTML=`
  <h2>Connaissances</h2>
  <p class="lead">${CARDS.length} cartes pour apprendre les définitions, les mécanismes et les auteurs. Lis la question, réponds de tête, retourne la carte, puis dis si tu savais.</p>
  <div class="deckbar">
    <select id="f-ch" aria-label="Chapitre"><option value="all">Tous les chapitres</option>${CH.map(x=>`<option value="${x.id}" ${String(x.id)===fc.ch?"selected":""}>${x.id}. ${esc(x.t)}</option>`).join("")}</select>
    <label><input type="checkbox" id="f-only" ${fc.only?"checked":""}> Seulement celles pas encore sues</label>
    <button class="btn" id="f-shuffle">Mélanger</button>
    <button class="btn ghost" id="f-reset">Tout remettre à zéro</button>
  </div>
  <p class="stat"><b>${knownIn}</b> sues sur <b>${chInDeck.length}</b> dans cette sélection · <b>${knownAll}</b> sur <b>${CARDS.length}</b> au total</p>
  <div class="progress" aria-hidden="true"><i style="width:${chInDeck.length?knownIn/chInDeck.length*100:0}%"></i></div>
  <div style="height:16px"></div>
  ${c?`
  <div class="card ${fc.flip?"back":""}" id="card" aria-live="polite">
    <div class="tag">Chapitre ${c.ch} · carte ${fc.i+1} sur ${total}${fc.known[c.id]?" · sue":""}</div>
    <div class="face">${fc.flip?esc(c.a):esc(c.q)}</div>
    <div class="actions">
      ${fc.flip?`<button class="btn primary" id="k-yes">Je savais</button><button class="btn" id="k-no">À revoir</button>`:`<button class="btn primary" id="k-flip">Retourner la carte</button>`}
      <button class="btn ghost" id="k-prev" ${fc.i===0?"disabled":""}>Précédente</button>
      <button class="btn ghost" id="k-next" ${fc.i>=total-1?"disabled":""}>Suivante</button>
    </div>
  </div>`:`<div class="empty">${fc.only?"Toutes les cartes de cette sélection sont sues. Décoche le filtre pour les revoir.":"Aucune carte dans cette sélection."}</div>`}`;
  $("#f-ch").onchange=e=>{fc.ch=e.target.value;fc.build();renderCards()};
  $("#f-only").onchange=e=>{fc.only=e.target.checked;fc.build();renderCards()};
  $("#f-shuffle").onclick=()=>{fc.deck=shuffle(fc.deck);fc.i=0;fc.flip=false;renderCards()};
  $("#f-reset").onclick=()=>{fc.known={};store.set("known",fc.known);fc.build();renderCards();renderStats()};
  if(c){
    const nxt=()=>{if(fc.i<total-1){fc.i++;fc.flip=false;renderCards()}else{fc.flip=false;renderCards()}};
    const mark=v=>{fc.known[c.id]=v;store.set("known",fc.known);renderStats();
      if(fc.only&&v){fc.deck.splice(fc.i,1);if(fc.i>=fc.deck.length)fc.i=Math.max(0,fc.deck.length-1);fc.flip=false;renderCards()}else nxt()};
    const flip=$("#k-flip");if(flip)flip.onclick=()=>{fc.flip=true;renderCards()};
    const y=$("#k-yes");if(y)y.onclick=()=>mark(true);
    const n=$("#k-no");if(n)n.onclick=()=>mark(false);
    $("#k-prev").onclick=()=>{fc.i--;fc.flip=false;renderCards()};
    $("#k-next").onclick=()=>{fc.i++;fc.flip=false;renderCards()};
  }
}

const qz={sub:"qcm",ch:"all",pool:[],i:0,score:0,chosen:null,done:false,best:store.get("best",{}),
  start(){
    QCM.forEach(q=>{delete q._o});
    qz.pool=shuffle(QCM.filter(q=>qz.ch==="all"||String(q.ch)===qz.ch));
    qz.i=0;qz.score=0;qz.chosen=null;qz.done=false;
  }};
function renderQuiz(){
  const el=$("#view-quiz");
  const bestAll=qz.best.all;
  el.innerHTML=`
  <h2>Quiz et exos</h2>

function chapSelect(id,val){return `<select id="${id}" aria-label="Chapitre"><option value="all">Tous les chapitres</option>${CH.map(x=>`<option value="${x.id}" ${String(x.id)===val?"selected":""}>${x.id}. ${esc(x.t)}</option>`).join("")}</select>`}
function renderQcm(){
  const b=$("#q-body");
  const top=`<div class="row" style="margin-bottom:18px">${chapSelect("q-ch",qz.ch)}<button class="btn" id="q-restart">Recommencer</button>${qz.best[qz.ch]!=null?`<span class="stat">Meilleur score : <b>${qz.best[qz.ch]} %</b></span>`:""}</div>`;
  if(!qz.pool.length)qz.start();
  if(!qz.pool.length){b.innerHTML=top+`<div class="empty">Aucune question pour ce chapitre.</div>`;bindQcmTop();return}
  if(qz.done){
    const pct=Math.round(qz.score/qz.pool.length*100);
    b.innerHTML=top+`<div class="qbox"><p class="stat">Terminé</p><div class="score num">${qz.score} / ${qz.pool.length}</div><p>${pct} % de bonnes réponses. ${pct>=80?"Ce chapitre est solide.":pct>=50?"Relis les explications des erreurs et recommence.":"Reprends le cours de ce chapitre puis les cartes."}</p><button class="btn primary" id="q-again">Rejouer</button></div>`;
    bindQcmTop();$("#q-again").onclick=()=>{qz.start();renderQcm()};return;
  }
  const q=qz.pool[qz.i];
  if(!q._o)q._o=shuffle(q.o.map((t,k)=>({t,ok:k===q.a})));
  const answered=qz.chosen!==null;
  b.innerHTML=top+`<div class="qbox">
    <div class="qmeta"><span>Question ${qz.i+1} sur ${qz.pool.length} · chapitre ${q.ch}</span><span>Score : <b class="num">${qz.score}</b></span></div>
    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${q._o.map((o,k)=>`<button class="opt ${answered?(o.ok?"good":(qz.chosen===k?"bad":"")):""}" data-k="${k}" ${answered?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>
    ${answered?`<div class="explain"><span class="verdict ${q._o[qz.chosen].ok?"good":"bad"}">${q._o[qz.chosen].ok?"Bonne réponse.":"Pas tout à fait."}</span> ${esc(q.e)}</div>
    <div style="margin-top:14px"><button class="btn primary" id="q-next">${qz.i+1<qz.pool.length?"Question suivante":"Voir le score"}</button></div>`:""}
  </div>`;
  bindQcmTop();
  b.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const k=+btn.dataset.k;qz.chosen=k;if(q._o[k].ok){qz.score++;ev.qcm[q.q]=1;saveEv()}renderQcm();
  });
  const nx=$("#q-next");if(nx)nx.onclick=()=>{
    if(qz.i+1<qz.pool.length){qz.i++;qz.chosen=null}else{
      qz.done=true;const pct=Math.round(qz.score/qz.pool.length*100);
      if(qz.best[qz.ch]==null||pct>qz.best[qz.ch]){qz.best[qz.ch]=pct;store.set("best",qz.best)}renderStats()}
    renderQcm();
  };
}
function bindQcmTop(){
  $("#q-ch").onchange=e=>{qz.ch=e.target.value;qz.start();renderQcm()};
  $("#q-restart").onclick=()=>{qz.start();renderQcm()};
}

const MARKS=[["ok","Juste"],["part","Partiel"],["ko","À revoir"]];
const dsv={ch:"all",open:{},draft:store.get("dsdraft",{})};
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"'");
const kwOf=k=>{const[l,st]=k.split("|");return {label:l,stem:norm(st||l)}};

        <p class="stat" style="margin:8px 0">Mots-clés présents dans ta réponse : <b>${hit.filter(h=>h.ok).length} / ${hit.length}</b></p>
        <div class="row" role="group" aria-label="Auto-correction"><span class="stat">Je me note :</span>${MARKS.map(([k,t])=>`<button class="btn ${mark===k?"primary":"ghost"}" data-mark="${d.id}:${k}">${t}</button>`).join("")}</div></div>`:""}
    </div>`}).join("")}</div>`;
  $("#x-ch").onchange=e=>{dsv.ch=e.target.value;renderDs()};
  b.querySelectorAll("[data-ta]").forEach(t=>t.oninput=()=>{dsv.draft[t.dataset.ta]=t.value;store.set("dsdraft",dsv.draft)});

/* ---------- évaluation : points, niveaux, auto-évaluation, examen blanc ---------- */
const ev={qcm:store.get("evq",{}),ds:store.get("evd",{}),self:store.get("evs",{}),mock:store.get("evm",[])};
function saveEv(){store.set("evq",ev.qcm);store.set("evd",ev.ds);store.set("evs",ev.self);store.set("evm",ev.mock)}
const LEVELS=[[0,"Débutant"],[25,"En progression"],[50,"Intermédiaire"],[70,"Avancé"],[88,"Expert"]];
const lvl=p=>LEVELS.filter(l=>p>=l[0]).pop()[1];
function chapStats(c){
  const cards=CARDS.filter(x=>x.ch===c.id),qs=QCM.filter(x=>x.ch===c.id),xs=DS.filter(x=>x.ch===c.id);
  const parts=[];
  parts.push({k:"Lu",v:cours.read[c.id]?1:0,n:"cours"});
  if(cards.length)parts.push({k:"Cartes sues",v:cards.filter(x=>fc.known[x.id]).length/cards.length,n:cards.filter(x=>fc.known[x.id]).length+"/"+cards.length});
  if(qs.length)parts.push({k:"QCM réussis",v:qs.filter(x=>ev.qcm[x.q]).length/qs.length,n:qs.filter(x=>ev.qcm[x.q]).length+"/"+qs.length});
  if(xs.length){const sc=x=>ev.ds[x.id]==="ok"?1:ev.ds[x.id]==="part"?.5:0;const tot=xs.reduce((s,x)=>s+sc(x),0);parts.push({k:"Questions de DS",v:tot/xs.length,n:fr(tot,1)+"/"+xs.length})}
  const pct=Math.round(parts.reduce((s,p)=>s+p.v,0)/parts.length*100);
  return {parts,pct};
}
function points(){
  const read=CH.filter(c=>cours.read[c.id]).length*10;
  const cards=CARDS.filter(x=>fc.known[x.id]).length*2;
  const q=Object.keys(ev.qcm).length*5;
  const x=DS.reduce((s,d)=>s+(ev.ds[d.id]==="ok"?10:ev.ds[d.id]==="part"?5:0),0);
  const m=ev.mock.length?Math.max(...ev.mock.map(r=>r.note))*5:0;
  const max=CH.length*10+CARDS.length*2+QCM.length*5+DS.length*10+100;
  return {read,cards,q,x,m,total:read+cards+q+x+m,max};
}
const SELF=[["bas","À revoir"],["moy","Moyen"],["haut","Maîtrisé"]];
const mock={on:false,pool:[],i:0,score:0,chosen:null,done:false,t0:0,tick:null,wrong:[]};
function mockStart(){
  mock.pool=shuffle(QCM).slice(0,20).map(q=>Object.assign({},q,{_o:shuffle(q.o.map((t,k)=>({t,ok:k===q.a})))}));
  Object.assign(mock,{on:true,i:0,score:0,chosen:null,done:false,t0:Date.now(),wrong:[]});
}
const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s"};

  <div class="evcard"><span class="stat">Meilleur examen blanc</span><div class="score num">${best===null?"–":fr(best,1)+" / 20"}</div><span class="stat">${ev.mock.length} passage${ev.mock.length>1?"s":""}</span></div></div>

  <p class="stat" style="margin-top:6px">Barème : 10 pts par chapitre lu, 2 par carte sue, 5 par QCM réussi (une fois), 10 par question de DS juste (5 si partielle), 5 × la meilleure note à l’examen blanc.</p>
  <h3 style="margin-top:28px">Mes chapitres</h3><p class="lead">Note objective (mesurée) et auto-évaluation (ton ressenti). Un écart signale un chapitre à retravailler.</p><div class="evlist">`;
  stats.forEach(({c,s})=>{

    <div class="progress" style="max-width:none"><i style="width:${s.pct}%"></i></div>
    <div class="evd">${s.parts.map(p=>`<span>${p.k}${p.k==="Lu"?" : "+(p.v?"oui":"non"):" : "+p.n}</span>`).join("")}</div>
    <div class="row" role="group" aria-label="Auto-évaluation chapitre ${c.id}"><span class="stat">Mon ressenti :</span>${SELF.map(([k,t])=>`<button class="btn ${sv===k?"primary":"ghost"}" data-self="${c.id}:${k}">${t}</button>`).join("")}<button class="btn ghost" data-open="${c.id}">Réviser</button></div>
    ${warn?`<div class="explain">${warn}</div>`:""}</div>`;
  });
  h+=`</div><h3 style="margin-top:28px">Examen blanc</h3><div id="ev-mock"></div>`;
  if(ev.mock.length)h+=`<h3 style="margin-top:28px">Historique</h3><div class="evd" style="gap:8px">${ev.mock.slice(-8).reverse().map(r=>`<span class="chip2">${r.date} · <b class="num">${fr(r.note,1)} / 20</b> · ${r.dur}</span>`).join("")}</div><div style="margin-top:10px"><button class="btn ghost" id="ev-reset">Réinitialiser toute l’évaluation</button></div>`;
  el.innerHTML=h;renderMock();
  el.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const[c,k]=b.dataset.self.split(":");ev.self[c]=ev.self[c]===k?undefined:k;saveEv();renderEval()});
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{cours.cur=+b.dataset.open;store.set("chap",cours.cur);renderCours();go("cours")});
  const rs=$("#ev-reset");if(rs)rs.onclick=()=>{if(rs.dataset.sure){ev.qcm={};ev.ds={};ev.self={};ev.mock=[];saveEv();renderEval()}else{rs.dataset.sure=1;rs.textContent="Confirmer : effacer points, notes et historique"}};
}
function renderMock(){
  const b=$("#ev-mock");if(!b)return;
  if(!mock.on){b.innerHTML=`<div class="qbox"><p style="margin:0 0 12px">20 questions tirées au hasard dans tous les chapitres, sans correction pendant l’épreuve, chronométrées. Note finale sur 20, avec la liste des erreurs à revoir.</p><button class="btn primary" id="m-go">Lancer l’examen blanc</button></div>`;$("#m-go").onclick=()=>{mockStart();renderMock()};return}
  if(mock.done){
    const note=Math.round(mock.score/mock.pool.length*20*10)/10,dur=fmtT(mock.end-mock.t0);
    b.innerHTML=`<div class="qbox"><p class="stat">Terminé en ${dur}</p><div class="score num">${fr(note,1)} / 20</div><p>${note>=16?"Très bien : tu es prêt.":note>=12?"Bien, il reste quelques points à consolider.":note>=10?"Moyen : retravaille les chapitres ci-dessous.":"Insuffisant pour l’instant : reprends le cours et les cartes."}</p>
    ${mock.wrong.length?`<p><b>À revoir :</b></p>${mock.wrong.map(q=>`<div class="explain" style="margin-bottom:8px"><b>Ch. ${q.ch} · ${esc(q.q)}</b><br>Réponse : ${esc(q.o[q.a])}. ${esc(q.e)}</div>`).join("")}`:"<p>Aucune erreur.</p>"}
    <button class="btn primary" id="m-go">Nouvel examen blanc</button></div>`;$("#m-go").onclick=()=>{mockStart();renderMock()};return}
  const q=mock.pool[mock.i],ans=mock.chosen!==null;
  b.innerHTML=`<div class="qbox"><div class="qmeta"><span>Question ${mock.i+1} sur ${mock.pool.length}</span><span class="num" id="m-t"></span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">${q._o.map((o,k)=>`<button class="opt ${ans&&mock.chosen===k?"good":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>
  ${ans?`<div style="margin-top:14px"><button class="btn primary" id="m-next">${mock.i+1<mock.pool.length?"Question suivante":"Terminer et voir la note"}</button></div>`:""}</div>`;
  const tick=()=>{const t=$("#m-t");if(t)t.textContent=fmtT(Date.now()-mock.t0)};tick();mock.tick=setInterval(tick,1000);
  b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{mock.chosen=+x.dataset.k;if(q._o[mock.chosen].ok){mock.score++;ev.qcm[q.q]=1}else mock.wrong.push(q);renderMock()});
  const nx=$("#m-next");if(nx)nx.onclick=()=>{
    if(mock.i+1<mock.pool.length){mock.i++;mock.chosen=null}else{
      mock.done=true;mock.end=Date.now();clearInterval(mock.tick);
      const note=Math.round(mock.score/mock.pool.length*20*10)/10;
      ev.mock.push({note,date:new Date().toLocaleDateString("fr-FR"),dur:fmtT(mock.end-mock.t0)});saveEv();renderEval();return}
    renderMock()};
}
function renderStats(){if(!$("#view-evaluation").hidden)renderEval()}

renderCours();
fc.build();renderCards();
qz.start();renderQuiz();
showView(location.hash.slice(1)||store.get("view","cours"));
