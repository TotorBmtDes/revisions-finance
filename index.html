/* ---------- données : chapitres (d'après les deux documents Word uniquement) ---------- */
const CH=[
{id:1,t:"Évaluation, investisseur, système financier",html:`
<p class="lead">Le cadre du cours, la logique de l’investisseur et le rôle du système financier.</p>
<div class="callout"><b>Évaluation.</b> 2 contrôles continus (CC) comptent pour 40 % : le 1er CC a lieu le 6 novembre (questions de cours et potentiellement des petits exercices), le 2e lors de la dernière séance (épreuve pratique). 1 contrôle terminal (CT) compte pour 60 % : examen sur ordinateur, avec des données de marché à travailler.</div>
<h3>Plan du cours</h3>
<ul><li>Généralités sur les marchés financiers</li><li>Théorie du pricing, théorie des marchés efficients</li><li>La mécanique financière : deux notions fondamentales, la capitalisation et l’actualisation</li><li>Le risque en finance</li><li>Instruments financiers : obligations, actions, options</li></ul>
<p>Cette version du site couvre la partie 1 (généralités sur les marchés financiers) et le début de la partie 2 (mécanique financière : capitalisation, actualisation, VAN, TRA).</p>
<h3>La logique de l’investisseur financier</h3>
<p>L’investisseur financier est la personne qui fait l’acquisition d’un titre financier. Il a un <b>double objectif</b> :</p>
<ul><li>Le temps pendant lequel il prête ses fonds à l’entreprise, qui lui cède en contrepartie un de ses titres financiers, doit lui rapporter une rémunération, car il renonce à utiliser les fonds prêtés.</li>
<li>Le risque qu’il prend doit lui rapporter une rémunération, <b>proportionnelle au risque</b>.</li></ul>
<h3>Action et obligation</h3>
<div class="tablebox"><table><tr><th></th><th>Action (ou part)</th><th>Obligation</th></tr>
<tr><td>Nature</td><td>Part de capital, titre de propriété. L’investisseur devient actionnaire (copropriétaire)</td><td>Titre de créance, donc dette. Un prêt à une entreprise ou à un État : l’investisseur est créancier et ne possède aucune part de la société</td></tr>
<tr><td>Rémunération</td><td>Dividende (variable), non garanti, et plus-value éventuelle à la revente</td><td>Fixe ou variable (indexée) : coupon (intérêts), versé à des dates régulières, plus remboursement du capital à l’échéance</td></tr>
<tr><td>Risque</td><td>Élevé : en cas de faillite, l’actionnaire est remboursé en dernier, après tous les créanciers, et peut perdre toute sa mise</td><td>Modéré à faible (selon la solvabilité de l’émetteur). Prioritaire sur l’action</td></tr></table></div>
<h3>Le système financier</h3>
<p>Les marchés financiers sont une composante du système financier (SF). Le SF joue un rôle fondamental : il met en relation des agents économiques <b>excédentaires</b> en ressources (qui ont de l’épargne, souvent les ménages) et des agents économiques <b>déficitaires</b> (entreprises, État) qui ont besoin de ressources et les demandent aux premiers.</p>
<div class="formula">AEE (excédentaires) → SF → AEBF (déficitaires)</div>
<p>Cette relation peut être <b>directe</b> ou <b>indirecte</b>.</p>`},
{id:2,t:"Finance directe, indirecte, ALM",html:`
<p class="lead">Deux façons de mettre en relation l’épargne et le besoin de financement.</p>
<h3>La finance directe</h3>
<p>Les agents économiques qui ont des excédents de ressources financent <b>directement</b> ceux qui ont besoin de financement. Le SF sert uniquement de <b>courtier</b> : il met en relation les demandeurs avec ceux qui peuvent prêter. C’est la finance des marchés financiers : c’est là que se rencontrent l’offre et la demande de fonds, et le financement est contractuellement direct entre l’agent excédentaire et l’agent en besoin.</p>
<p><b>Intermédiaires de la finance directe :</b> CIF (conseiller en investissements financiers), EI, PSI (prestataires de services d’investissement : exécution d’ordres). Les banques en font partie, non pas dans leur fonction de financement mais dans leur fonction de conseil.</p>
<p>L’activité d’intermédiaire financier <b>n’apparaît pas à son bilan</b> : il n’accorde pas de financement et ne collecte pas de ressources. Seule sa rémunération (commission de courtage) apparaît dans son <b>compte de résultat</b>.</p>
<h3>La finance indirecte</h3>
<p>C’est la finance <b>intermédiée par le système bancaire</b> (partie importante du SF). Les banques peuvent acheter des titres émis par des entreprises (actions ou obligations). Elles peuvent émettre elles-mêmes des titres de dette achetés par leurs clients, et se refinancer par la collecte de dépôts. Le système bancaire sert d’<b>écran</b> entre les demandeurs et les pourvoyeurs de capitaux : ils ne sont pas mis en relation contractuelle.</p>
<p>La banque opère une <b>transformation</b> : elle collecte des ressources à court terme (CT) et finance avec elles des prêts, obligations ou actions d’entreprises, des ressources de long terme (LT). Elle peut aussi émettre elle-même des obligations souscrites par le public (dette à moyen et long terme).</p>
<div class="tablebox"><table><tr><th>Actif (emplois)</th><th>Passif (ressources)</th></tr><tr><td>Portefeuille d’actions, de titres, crédits</td><td>Ressources collectées auprès des clients (dépôts) ou empruntées à la banque centrale, dette émise</td></tr></table></div>
<p>Il faut bien distinguer l’<b>intermédiation financière</b> (finance indirecte) de l’<b>activité d’intermédiaire financier</b> (finance directe).</p>
<h3>La marge d’intermédiation</h3>
<p>Les ressources que mobilise la banque ne sont pas gratuites : elles ont un coût. Parallèlement, les emplois lui rapportent une rémunération.</p>
<div class="tablebox"><table><tr><th>Ressources</th><th>Emplois</th></tr><tr><td>Volume 100, intérêts payés 10 : coût 10 / 100 = 10 %</td><td>Volume 100, rémunération 12 : 12 / 100 = 12 %</td></tr></table></div>
<div class="formula">marge d’intermédiation = 12 % − 10 % = 2 %</div>
<h3>Désintermédiation et économie d’endettement</h3>
<ul><li>En Europe, l’économie financière et la <b>désintermédiation</b> sont de plus en plus fortes : les marchés financiers jouent un rôle plus important, une part croissante du financement des entreprises se fait directement sur les marchés.</li>
<li>Quand les marchés financiers sont peu développés, le mode privilégié est l’endettement bancaire : c’est l’<b>économie d’endettement</b>. Les entreprises sont fortement endettées auprès de leurs banques, elles-mêmes endettées auprès de la banque centrale.</li>
<li>Risque en économie d’endettement : <b>risque de bilan et de solvabilité de l’emprunteur</b>. Si l’entreprise ne génère plus assez de cash flows pour rembourser ses intérêts, il y a un effet boule de neige sur la banque.</li>
<li>Risque en économie de marché : <b>risque sur la valeur du titre</b>, volatilité du titre.</li>
<li>Quand les marchés sont développés, l’endettement n’est plus la seule solution : l’entreprise peut se financer par capitaux propres (augmentation de capital, émission de nouveaux titres souscrits directement par les investisseurs). L’économie de marchés financiers se caractérise par l’appel direct à l’épargne des investisseurs : obligations, billets de trésorerie…</li></ul>
<div class="callout"><b>Courtage ou intermédiation ?</b> En courtage, la banque ne porte pas de risque à son bilan : elle craint seulement que le client ne la paie pas. Sur un prêt de 10 M€ à 5 %, elle ne perd que 500 K€ en cas de courtage, mais 10 M€ en intermédiation financière. L’intermédiaire financier est souvent plus rémunérateur, et la tendance de l’industrie bancaire est d’aller vers les métiers de service.</div>
<h3>Banques, OPCVM (SICAV, FCP)</h3>
<p>La banque conçoit l’OPCVM et le dote d’actifs (actions, obligations…), puis émet des parts auprès d’investisseurs, qui acquièrent une ou plusieurs parts de l’OPCVM. Un OPCVM investi uniquement en actions est un OPCVM <b>dynamique</b>.</p>
<h3>Auteurs et marchéisation</h3>
<ul><li><b>Gurley et Shaw</b> ont théorisé la distinction finance directe / finance indirecte. <b>Hicks</b> : économie de marchés financiers.</li>
<li>Les crédits bancaires destinés aux ménages et aux PME sont dispensés largement par les banques. Il y a une tarification du marché : c’est la <b>marchéisation</b>. Le marché financier influence les prix proposés par les banques, qui doivent s’ajuster aux prix des marchés pour ne pas perdre leurs clients.</li></ul>
<h3>ALM : Asset and Liability Management</h3>
<p>Pratique de gestion financière stratégique utilisée surtout par les banques, les compagnies d’assurance et les grandes entreprises, pour analyser, piloter et équilibrer l’ensemble de leurs actifs et de leurs passifs. Elle vise un <b>adossement</b> du bilan de la banque.</p>
<ul><li><b>Actifs</b> (ce que l’organisation possède) : prêts accordés, investissements, liquidités, titres.</li>
<li><b>Passifs</b> (ce qu’elle doit) : dépôts des clients, emprunts, engagements envers des assurés.</li></ul>
<ol><li><b>Gérer les risques financiers :</b> risque de taux d’intérêt (taux des emprunts et des prêts qui évoluent de manière décalée) et risque de liquidité (ne pas avoir assez de liquidités pour faire face aux demandes immédiates).</li>
<li><b>Éviter le décalage de maturité :</b> ne pas avoir des dettes à rembourser à court terme alors que les actifs ne rapportent qu’à long terme.</li>
<li><b>Optimiser la rentabilité :</b> trouver le juste équilibre entre la prise de risque (profit) et la solvabilité à long terme, pour respecter la réglementation (accords de Bâle pour les banques).</li></ol>`},
{id:3,t:"Marchés primaire, secondaire, dérivés",html:`
<p class="lead">Où les titres sont créés, échangés, et où l’on négocie des produits qui en dépendent.</p>
<h3>Du marché primaire au marché secondaire</h3>
<ul><li>Le <b>marché primaire (MP)</b> est le marché de l’émission, de la création des titres financiers. Le <b>marché secondaire (MS)</b> est le marché des transactions ultérieures à l’émission, le « marché de l’occasion ».</li>
<li>Deux éléments essentiels les caractérisent : le <b>prix</b> du titre (son cours) et la <b>chose</b> (le titre). La vie d’un titre est liée au fait qu’il peut être acheté et vendu à tout moment.</li></ul>
<div class="tablebox"><table><tr><th></th><th>Marché primaire</th><th>Marché secondaire</th></tr>
<tr><td>Rôle</td><td>Création des titres, émission</td><td>Transactions ultérieures</td></tr>
<tr><td>Pour l’entreprise</td><td>Elle reçoit du cash en échange (<i>new money</i>) : c’est là qu’elle lève des fonds et se finance. Marché primordial</td><td>Ne touche pas sa trésorerie : on achète et vend des titres déjà créés, simple changement de propriétaire. L’entreprise s’en soucie peu</td></tr>
<tr><td>Fonction</td><td>Permet à des agents économiques de se procurer des ressources par l’émission de titres cotés sur un marché (visibilité sur leur cours)</td><td>Assure la valorisation et la cotation des titres, la liquidité</td></tr></table></div>
<p>La cotation par la Banque de France correspond à l’analyse financière de la santé de l’entreprise, traduite en un cours de Bourse.</p>
<h3>Les fonctions du marché secondaire</h3>
<ul><li>L’investisseur vérifie à chaque moment s’il doit acheter ou vendre ses actifs. Il ne veut pas s’immobiliser sur un placement : avant même d’entrer dans un investissement, il a déjà pensé à sa sortie.</li>
<li>La sortie est relativement aisée pour un titre à <b>court terme</b>, plus complexe pour un investissement de long terme. Pour un actionnaire, la seule possibilité de se dégager est de vendre son action à un autre investisseur intéressé.</li>
<li>Le MS assure la <b>liquidité</b> des titres, leur valorisation et leur cotation, et permet le refinancement des investissements.</li>
<li>C’est un <b>jeu à somme nulle</b> entre investisseurs, a priori totalement indépendant de l’émetteur initial : une entreprise qui a émis des obligations est certaine de la disponibilité des fonds selon l’échéancier du contrat. Aucun cash supplémentaire pour l’entreprise.</li>
<li>Il ne finance pas le développement économique, mais son rôle reste important : il relaie ou refinance les investissements initiaux.</li></ul>
<h3>Le marché des dérivés : marchés à terme et optionnels</h3>
<p>On y négocie des <b>produits dérivés</b> : des produits dont la valeur dépend d’un autre actif, le <b>sous-jacent</b> (actions, obligations, matières premières agricoles…). Le marché des dérivés est un marché sur un marché, un contrat sur un contrat.</p>
<p>Deux grandes familles : les <b>contrats à terme</b> et les <b>options</b>.</p>
<ul><li>Les dérivés permettent de prendre des positions importantes, des intentions fermes à l’achat ou à la vente, avec une <b>mise de fonds limitée</b> grâce à un <b>effet de levier</b> important.</li>
<li>Avantage commun : <b>transférer un risque à un tiers</b>, se couvrir contre un risque avant de spéculer. Produits standardisés, de très grande liquidité.</li>
<li><b>Option :</b> son prix donne le droit d’acquérir ou de vendre une certaine quantité à une certaine date. Il peut y avoir une disproportion entre le prix payé et la position que l’on peut prendre : une mise limitée permet une position plus importante sur une action.</li></ul>
<h3>Le contrat à terme (future, forward)</h3>
<p>Accord <b>ferme</b> entre deux parties pour acheter ou vendre un actif sous-jacent (matière première, action, taux d’intérêt, devise, indice boursier) à une date future déterminée, à un prix fixé dès aujourd’hui.</p>
<ul><li><b>Engagement ferme :</b> contrairement à l’option (un droit, pas une obligation), l’acheteur doit acheter et le vendeur doit vendre à l’échéance, quel que soit le prix du marché.</li>
<li><b>Sous-jacent :</b> pétrole, blé, or, taux d’intérêt, obligations d’État, indices (CAC 40, S&amp;P 500).</li>
<li><b>Échéance :</b> date future convenue du dénouement (fin mars, juin, septembre…).</li>
<li><b>Couverture :</b> un producteur de blé craint une baisse du prix d’ici sa récolte dans six mois. Il vend aujourd’hui un contrat à terme à un prix fixé. Si le prix baisse, le contrat compense sa perte ; si le prix monte, il ne profite pas de la hausse, mais son chiffre d’affaires est sécurisé.</li>
<li><b>Spéculation :</b> un investisseur qui anticipe la hausse du pétrole achète un contrat à terme sans posséder de baril, pour revendre le contrat plus cher avant l’échéance. Autre exemple : un produit spéculatif parie sur une forte baisse de l’euro par rapport au dollar.</li></ul>`},
{id:4,t:"Les six fonctions du système financier",html:`
<p class="lead">Typologie de Merton et Bodie.</p>
<p>Un système financier est constitué des marchés financiers et des intermédiaires financiers. Son objectif : fournir les liquidités aux projets d’investissement qui apparaissent les plus rentables compte tenu des risques anticipés sur ces placements. Deux grandes notions : <b>rentabilité et risque</b>, dont la relation est négative (le texte de ton cours parle d’une « relation négative »).</p>
<p>Comme tout marché, un marché financier assure l’équilibre entre l’offre et la demande d’actifs financiers. Il permet aussi aux investisseurs de transformer un revenu actuel en revenu futur, pour une consommation espérée plus grande dans le futur, et crée pour l’emprunteur une ressource financière utilisable immédiatement, en contrepartie d’un intérêt à payer.</p>
<p>Six fonctions essentielles, mises en évidence par les économistes <b>Merton et Bodie</b> :</p>
<ol><li><b>Faciliter les transactions :</b> mécanismes de règlement et de compensation des opérations (chèque, carte bancaire, téléphone…).</li>
<li><b>Mettre en commun des fonds</b> pour entreprendre des projets de grande taille et de coût important. Le marché financier est un mécanisme de subdivision ou de partage du capital des entreprises : l’investisseur accède aux ressources de millions d’épargnants, peut diversifier et élargir ses investissements. L’entrepreneur est incité à avoir des résultats performants. L’épargnant détient ses actifs sous une forme plus liquide que l’investissement immobilier.</li>
<li><b>Répartir les ressources</b> dans le temps, l’espace et entre secteurs économiques : les jeunes ménages empruntent pour acheter un logement, ceux qui approchent de la retraite épargnent. Des secteurs à maturité peuvent financer des secteurs à fort développement.</li>
<li><b>Fournir des outils de gestion du risque :</b> il n’est pas prudent de tout investir dans une même entreprise (si elle fait faillite, on perd tout). Les intermédiaires créent des épargnes collectives (fonds communs de placement) qui permettent de réduire le risque par la diversification.</li>
<li><b>Fournir une information sur les prix</b> au plus bas coût possible, ce qui aide la décision individuelle : taux d’intérêt et prix (actions, obligations) sont des indicateurs d’investissement.</li>
<li><b>Limiter les problèmes entre les parties d’un contrat</b> (asymétrie d’information) : il n’est pas toujours possible de savoir si l’autre partie fait ce qui est prévu. L’investisseur qui confie des fonds espère qu’ils seront gérés au mieux de ses intérêts plutôt que de ceux du gestionnaire. Si ce n’est pas le cas, les mauvais gestionnaires sont sanctionnés par le marché : sélection naturelle, <b>discipline de marché</b>, alignement d’intérêts entre les parties.</li></ol>`},
{id:5,t:"Le rôle financier des banques",html:`
<p class="lead">Du modèle commercial / affaires à la banque universelle, puis aux trois départements.</p>
<h3>Historique</h3>
<ul><li>Les banques se répartissaient entre <b>banques commerciales</b> (collecte de ressources auprès des clients et crédits à ces clients) et <b>banques d’affaires</b> (conseil en fusion-acquisition, intermédiaire financier pour le placement d’instruments financiers, sans toucher à leur bilan).</li>
<li>Depuis le début du XXe siècle, émergence de grandes <b>banques universelles</b> aux États-Unis et en Europe, à l’occasion de rapprochements entre banques commerciales et banques d’affaires : en 1990, BNP et Paribas ; aux États-Unis, JP Morgan et Chase Manhattan. D’autres rapprochements : Bank of America et Merrill Lynch.</li>
<li>Tendance favorisée par l’évolution de la réglementation, notamment aux États-Unis avec le <b>Glass-Steagall Act</b> : cette loi interdisait le rapprochement entre banque commerciale et banque d’affaires, et a été <b>abrogée en 1999</b>. Elle traduit la volonté des grands groupes de mettre en place un business model de banque universelle dans un contexte d’internationalisation et de complexification croissante.</li>
<li><b>Crise financière de 2008 :</b> volonté politique de scinder à nouveau les grands groupes bancaires, pour séparer les activités de dépôts des activités de marchés et empêcher que les ressources des épargnants soient utilisées à des fins spéculatives. Idée portée par le souci de protéger les épargnants, partiellement matérialisée dans les réglementations nationales : les banques ont dû cantonner dans des structures différentes leurs activités spéculatives de compte propre (demande d’agrément pour une filiale).</li>
<li>La grande majorité des groupes bancaires ont aujourd’hui trois départements : détail, financement et investissement, gestion d’actifs.</li></ul>
<h3>La banque de détail (<i>retail banking</i>)</h3>
<ul><li>Clients : particuliers, professionnels et PME. Fonction d’<b>intermédiation financière</b> : elle collecte l’épargne des agents excédentaires et prête (crédit) à ceux qui ont besoin de financement.</li>
<li>Des millions de clients : dimension quasi industrielle (effet de masse), produits financiers standardisés. Un portefeuille important de clients et de nombreux crédits <b>éliminent une partie du risque par la diversification</b> des profils de risque.</li>
<li>Activité fortement <b>concurrentielle</b> : le prêt bancaire est un produit standardisé, donc les clients font aisément jouer la concurrence. Les <b>marges sont peu élevées</b> après prise en compte des frais généraux et du <b>coût du risque</b> (provisions pour créances douteuses).</li>
<li><b>Services annexes</b> pour les entreprises : gestion des flux financiers (encaissement de chèques, virements, paiement électronique, gestion de trésorerie).</li>
<li><b>Services spécialisés pour les particuliers :</b> crédit à la consommation, produits d’assurance.</li>
<li><b>Services spécialisés pour les PME :</b> l’<b>affacturage</b> (financement fondé sur une cession de créances à un factor, qui paie la créance) et le <b>crédit-bail</b>, pour une raison historique : ces services étaient déjà proposés aux PME à l’origine.</li></ul>
<h3>La banque de financement et d’investissement (BFI, ou CIB)</h3>
<p>Le département le plus rentable. Services sophistiqués, sur mesure, pour de grandes entreprises ; quelques milliers de clients tout au plus (exemples : BNP Paribas CIB, CACIB).</p>
<ol><li><b>ECM</b> (<i>Equity Capital Market</i>) : accès au marché actions. Aide à l’introduction en bourse et aux augmentations de capital ultérieures ; émission de produits financiers transformables en actions, comme les <b>OCA</b> (obligations convertibles en actions).</li>
<li><b>DCM</b> (<i>Debt Capital Market</i>) : accès au marché obligataire. Aide à lever de la dette auprès d’investisseurs par l’émission d’obligations.</li>
<li><b>M&amp;A</b> (<i>Mergers and Acquisitions</i>) : conseil en fusion-acquisition. Pas une opération de financement, un conseil de valorisation.</li>
<li><b>Financements bancaires spécialisés et importants :</b> crédits syndiqués ou sophistiqués. Une banque est <b>chef de file</b> (tête de file) et d’autres établissements se syndiquent. Exemple de ton cours : BNP 50 %, CA 25 %, CE 25 %.</li>
<li><b>Marchés des changes et des matières premières :</b> produits qui permettent aux clients de se couvrir contre le risque de variation des prix ou des monnaies.</li></ol>
<p>Les trois premiers services (ECM, DCM, M&amp;A) rendent compte de la partie <b>investissement</b> de la banque.</p>
<h3>La gestion d’actifs</h3>
<ul><li>Clients propres : <b>investisseurs institutionnels</b> (compagnies d’assurance), <i>family offices</i> (regroupement de personnes fortunées) et particuliers très fortunés.</li>
<li>Produits : <b>SICAV, FCP</b> et produits structurés (packages financiers). Elle peut recourir à la BFI pour obtenir des instruments de couverture.</li></ul>
<h3>Autres acteurs, crise de 2020</h3>
<ul><li>À côté des groupes globaux, des acteurs spécialisés dans un nombre réduit d’activités : conseil en fusion-acquisition (Lazard, Rothschild, Hottinger), néobanque (Revolut), banque implantée dans une zone géographique (Crédit Mutuel Arkéa : Ouest et Est de la France).</li>
<li>La <b>crise sanitaire de 2020</b> montre à nouveau, après 2008, le rôle central des banques : elles fournissent des liquidités ou des financements et sont aussi un <b>indicateur d’aversion au risque</b> des investisseurs.</li>
<li>Leur métier de base : <b>apprécier le risque et le repackager</b>, en éliminant le risque qui peut être diversifié. Du fait des contraintes réglementaires importantes, une partie de leur activité traditionnelle (par exemple le trading) est désormais exercée par des acteurs non régulés.</li></ul>`},
{id:6,t:"Les marchés efficients (Fama)",html:`
<p class="lead">Un premier cadre théorique : les prix reflètent-ils toute l’information ?</p>
<p><b>Marché financier efficient :</b> marché où les prix des titres reflètent à tout instant toute l’information pertinente disponible sur ces titres. On parle aussi de théorie des marchés <b>à l’équilibre</b> ou des marchés <b>parfaits</b>.</p>
<ul><li>Le prix intègre instantanément les conséquences des événements passés et reflète déjà toutes les anticipations sur les événements futurs. Il est donc <b>impossible de prévoir les variations futures</b> : tous les éléments connus ou anticipés (passé, présent, futur) sont déjà dans le prix.</li>
<li>Seule une <b>information nouvelle totalement imprévue</b> modifie le prix. Son apparition étant imprévisible, les changements de prix sont <b>aléatoires</b> : la théorie parle de <b>marche au hasard</b> des taux de rentabilité quotidiens (processus stochastique).</li>
<li>L’ajustement du prix à une nouvelle information est <b>quasi instantané</b> car le niveau de concurrence entre investisseurs est très important. À tout moment, un titre est coté à un prix qui dépend de sa rentabilité et de son risque, tels que perçus ou anticipés par les investisseurs.</li>
<li>Économiste à retenir : <b>Eugène Fama</b> (université de Chicago, prix Nobel d’économie en <b>2013</b>).</li></ul>
<p>Trois niveaux d’efficience sont définis selon : la capacité à prévoir les cours futurs, la réponse des marchés à des événements ponctuels, l’influence des informations privilégiées sur les marchés.</p>
<h3>Les trois degrés</h3>
<div class="tablebox"><table><tr><th>Forme</th><th>Description</th><th>Implication</th></tr>
<tr><td>Faible</td><td>Les prix intègrent les données historiques</td><td>Analyse technique inutile</td></tr>
<tr><td>Semi-forte</td><td>Les prix intègrent les données historiques et publiques</td><td>Analyse technique et fondamentale inutiles</td></tr>
<tr><td>Forte</td><td>Les prix intègrent les données historiques, publiques et privées ou privilégiées</td><td>Même les initiés ne peuvent pas obtenir une meilleure rentabilité que le marché</td></tr></table></div>
<h3>Forme faible</h3>
<p>L’analyse technique est inutile : tous les investisseurs pensent le marché efficient, donc personne ne gagne en croyant que les variations du passé vont se reproduire. Il n’est pas possible de prévoir les rentabilités futures à partir de modèles statistiques qui lieraient les rentabilités à des taux de rendement, à l’écart entre taux long et court, etc.</p>
<h3>Forme semi-forte</h3>
<p>Les prix intègrent, en plus des informations historiques, toutes les informations <b>publiques</b> disponibles : rapports des grandes entreprises, articles de presse, information financière obligatoire (prospectus), annonce par l’entreprise d’un nouveau contrat. Le prix d’une action doit réagir immédiatement et ponctuellement à l’annonce d’une information significative : <b>aucun effet visible avant l’annonce, ni au lendemain de l’annonce</b>. Les données publiques étant aussi les données fondamentales, l’analyse fondamentale est inutile, comme l’analyse technique.</p>
<ul><li>Il est impossible de générer de manière constante un rendement anormal (alpha) en analysant rapports annuels ou ratios.</li>
<li>Seuls les investisseurs détenant des informations confidentielles (assimilables à un délit d’initié) ont un avantage réel pour surperformer.</li>
<li>L’ajustement est supposé si rapide que l’on ne peut pas exploiter le délai pour un profit d’arbitrage.</li></ul>
<h3>Forme forte</h3>
<p>Niveau le plus extrême : le prix reflète instantanément toute l’information, publique ou privée (projets secrets, décisions stratégiques non annoncées…). Même les initiés ne peuvent pas tirer parti de l’évolution des cours : un PDG au courant d’une fusion imminente ne pourrait pas en profiter, car le cours l’intégrerait déjà. Les marchés sont efficients au sens fort si les organismes de surveillance peuvent empêcher et réprimer les délits d’initiés.</p>
<ul><li>Si elle était vérifiée, la gestion passive (fonds indiciels, ETF) serait la seule stratégie rationnelle.</li>
<li>C’est un modèle surtout théorique, quasi unanimement jugé irréaliste : l’existence même de lois contre les délits d’initiés montre que l’information privée a une valeur non intégrée dans les cours.</li></ul>`},
{id:7,t:"La finance comportementale",html:`
<p class="lead">Les investisseurs ne sont pas toujours rationnels : les anomalies qui contredisent l’efficience.</p>
<h3>Thaler et Kahneman (années 1980)</h3>
<p>De nombreux économistes (dont <b>Thaler et Kahneman</b>) ont cherché dans les années 1980 à tester l’efficience des marchés. Ils ont mis en évidence des anomalies :</p>
<ul><li><b>Volatilité des marchés et instabilité des cours :</b> première contestation, issue du bon sens. Il semble y avoir du <b>bruit</b> (perturbation) autour de la valeur fondamentale du titre.</li>
<li><b>Dual listing :</b> des sociétés jumelles (quasi identiques, mêmes flux de dividendes, donc même valeur fondamentale) cotées sur deux marchés distincts ont des cours qui peuvent diverger. Sur un marché efficient, la valorisation devrait être la même.</li>
<li><b>Anomalies calendaires :</b> les titres semblent moins bien performer le lundi, et janvier est un mois particulier avec une meilleure rentabilité.</li>
<li><b>Anomalie météorologique :</b> la rentabilité est meilleure quand il fait beau que quand il pleut.</li></ul>
<h3>Quatre catégories d’anomalies</h3>
<ol><li><b>Fondamentales</b> (contredisent la forme semi-forte) : <b>effet taille</b> (les actions de faible capitalisation, <i>small caps</i>, rapportent plus à long terme que les <i>large caps</i>, même après ajustement du risque, le bêta) ; <b>effet valeur</b> (les actions décotées <i>value</i>, faible Price-to-Earnings ou fort Book-to-Market, surperforment les actions de croissance <i>growth</i>).</li>
<li><b>Techniques et de persistance</b> (contredisent la forme faible) : <b>effet momentum</b> (Jegadeesh et Titman, 1993) à 3-12 mois, les gagnants continuent de gagner et les perdants de baisser ; <b>retour à la moyenne</b> (<i>mean reversion</i>, De Bondt et Thaler, 1985) à 3-5 ans, les portefeuilles perdants finissent par surperformer les gagnants.</li>
<li><b>Calendaires :</b> <b>effet janvier</b> (rendements anormalement élevés en janvier, notamment pour les petites capitalisations, souvent expliqué par des ventes fiscales en décembre suivies de rachats) ; <b>effet week-end ou lundi</b> (rendements du lundi souvent inférieurs, parfois négatifs).</li>
<li><b>Comportementales</b> (bulles et krachs) : <b>sur-réaction</b> aux mauvaises nouvelles (krachs non justifiés par les fondamentaux) et <b>sous-réaction</b> aux annonces de résultats réguliers (fenêtres d’arbitrage) ; <b>bulles spéculatives</b> comme la bulle internet des années 2000, « exubérance irrationnelle ».</li></ol>
<h3>Remise en cause de la rationalité</h3>
<p>La finance comportementale remet en cause le postulat de base de la rationalité des investisseurs. Elle s’appuie sur d’autres disciplines : les économistes ont fait appel à la neuroscience et à la psychologie. Les décisions ne sont pas systématiquement rationnelles et sont influencées par l’environnement et les circonstances : on note des <b>biais de comportement</b> (mimétisme, excès de confiance, aversion à la perte).</p>
<ul><li><b>Gain ou perte :</b> les choix diffèrent. Les investisseurs préfèrent prendre des risques quand la probabilité de perte est forte, et préfèrent assurer un gain plus faible quand le gain est certain. Exemple : être sûr de gagner 50, ou avoir une chance sur deux de gagner 100 : ils choisissent d’assurer le gain certain.</li></ul>
<h3>Théorie du mimétisme (André Orléan)</h3>
<ul><li><b>Mimétisme normatif :</b> s’apparente au conformisme (normatisme).</li>
<li><b>Mimétisme informationnel :</b> imiter ce que les autres font parce qu’on les suppose mieux informés.</li>
<li><b>Mimétisme autoréférentiel :</b> prévoir le comportement majoritaire pour l’imiter. La « bonne action » dépend d’une action collective de tous les intervenants. Conséquence : <b>prophéties autoréalisatrices</b> (<i>self-fulfilling prophecy</i>) et <b>bulles spéculatives</b>.</li></ul>
<p>Ces phénomènes de mimétisme peuvent être accentués par des décisions préprogrammées dans les logiciels d’achat et de cession automatiques des opérateurs financiers (<b>program trading</b>).</p>
<div class="callout"><b>Flash crash du 2 mai 2022</b> (Bourse de Stockholm) : l’indice chute de plus de 8 % en quelques minutes. Cause : une simple erreur d’un opérateur d’une grande banque américaine (<i>fat finger</i>).</div>`},
{id:8,t:"Les comportements des investisseurs",html:`
<p class="lead">Un investisseur financier peut adopter un de ces trois comportements : couverture, spéculation, arbitrage.</p>
<div class="tablebox"><table><tr><th>Comportement</th><th>Définition</th></tr>
<tr><td>Couverture (<i>hedge</i>)</td><td>Se protéger contre un risque. Concept général : choisir un investissement long terme pour couvrir un financement long terme. <b>Adossement des maturités</b> en vue de couvrir un risque</td></tr>
<tr><td>Spéculation</td><td>Contrairement à la couverture, qui vise à éliminer le risque, la spéculation <b>accepte un risque</b> : le spéculateur prend position, parie sur l’évolution future d’un actif (s’il pense que le prix va augmenter, il achète), sans volonté d’exploiter l’actif ni d’en tirer un revenu régulier (dividende, coupon)</td></tr>
<tr><td>Arbitrage</td><td>L’arbitragiste <b>ne prend pas de risque</b> et n’a pas d’avis spéculatif sur l’évolution future d’un actif. Il tire parti des seules imperfections entre les marchés</td></tr></table></div>
<h3>Le spéculateur</h3>
<p>Opérateur de marché qui assume un risque, il joue un rôle <b>important et utile</b> dans l’économie. Exemple : si les besoins de ressources sont à long terme alors que l’épargne est à court terme, il faut que quelqu’un prenne le risque d’emprunter à court terme pour placer à long terme. Le spéculateur opère une <b>transformation des échéances</b>, donc pas d’adossement des maturités.</p>
<h3>L’arbitragiste</h3>
<ul><li>Il « screene » les marchés et tire parti des écarts de prix d’un même titre sur différents marchés, pour le revendre ensuite.</li>
<li>Les opérations d’arbitrage jouent un rôle important : elles contribuent à la <b>liquidité</b> du marché et réduisent le déséquilibre initial. Elles assurent l’<b>égalité des prix</b> entre les marchés au même moment, évitent les écarts de prix et rendent les marchés plus efficients.</li>
<li>Les algorithmes informatiques (progrès technologiques) rendent l’arbitrage de plus en plus rare et complexe.</li>
<li><b>Limites de l’arbitrage</b> (Shleifer et Vishny, 1997) : l’arbitragiste est théoriquement le garant de l’efficience, mais la finance comportementale a démontré que son pouvoir n’est pas absolu.</li></ul>`},
{id:9,t:"La valeur du temps et la capitalisation",html:`
<p class="lead">Partie 2 : mécanique financière. Un euro aujourd’hui vaut plus qu’un euro demain.</p>
<p>L’achat d’un titre financier est un acte <b>intéressé</b> : c’est renoncer à une satisfaction immédiate au profit d’un investissement dont on espère une satisfaction ultérieure supérieure. Conséquence : une <b>exigence de rentabilité</b> pour cet investissement. Si l’on ne rémunérait pas ce renoncement, on privilégierait l’utilité immédiate.</p>
<div class="callout">1 euro aujourd’hui n’est pas égal à 1 euro demain : il lui est <b>supérieur</b>. Différer le règlement d’une dépense, c’est la réduire ; accélérer le règlement d’une recette, c’est l’accroître. Il existe en temps normal un taux d’intérêt de l’argent, même en l’absence de risque.</div>
<h3>La capitalisation</h3>
<div class="formula">V<sub>N</sub> = V<sub>0</sub> × (1 + t)<sup>n</sup>&nbsp;&nbsp;&nbsp;t = (V<sub>N</sub> / V<sub>0</sub>)<sup>1/n</sup> − 1</div>
<p><b>Exemple :</b> un entrepreneur a investi 100 000 € fin 2013 dans sa société. Il la revend 10 ans plus tard pour 1,8 M€, sans avoir apporté d’autres fonds ni touché de dividende. Quel est le taux de rentabilité annuel ?</p>
<div class="formula">100 000 × (1 + i)<sup>10</sup> = 1 800 000&nbsp;→&nbsp;(1 + i)<sup>10</sup> = 18&nbsp;→&nbsp;1 + i = 18<sup>1/10</sup>&nbsp;→&nbsp;i = 18<sup>1/10</sup> − 1 ≈ 33,5 %</div>
<ul><li>La plus-value est de 1,7 M€ pour un investissement initial de 100 K€. Il faut calculer le taux de rentabilité d’un <b>placement équivalent</b> qui verse des revenus chaque année, non consommés mais <b>capitalisés</b>, qui génèrent eux-mêmes des revenus et transforment la somme initiale en 1,7 M€.</li>
<li>Les flux annuels de revenus deviennent du capital, productif de revenu à son tour. On fait l’hypothèse que les flux sont <b>réinvestis au même taux</b>. On cherche le taux d’un placement qui transforme, sur la même durée, le même capital initial en le même capital final.</li>
<li>Du fait de la capitalisation des intérêts, la croissance est <b>exponentielle, pas linéaire</b>.</li>
<li>Question du cours : est-ce la même chose de tripler son capital en 16 ans, de le doubler en 10 ans, ou de demander 7,177 centimes par euro investi ? (Doubler en 10 ans correspond à 7,177 % par an.)</li>
<li>Le moindre décalage entre le droit au revenu et l’encaissement de ce revenu modifie le taux de rentabilité. Ce qui importe, ce sont les <b>flux de trésorerie effectifs</b> : tout calcul financier précis tient compte des flux exactement au moment où ils sont touchés, et non au moment où ils sont acquis.</li></ul>`},
{id:10,t:"L’actualisation",html:`
<p class="lead">Chercher la valeur d’aujourd’hui d’une somme future.</p>
<h3>Définition</h3>
<p>L’actualisation permet de comparer des investissements qui ont une séquence de flux différente, en calculant une <b>valeur actuelle</b> qui aide à comparer les titres financiers.</p>
<ul><li>Actualiser, c’est <b>déprécier le futur</b>, donc être exigeant vis-à-vis des flux futurs plutôt que des flux présents. Les flux futurs ne sont pas utilisables immédiatement. On applique au flux futur un <b>coefficient d’actualisation inférieur à 1</b>.</li>
<li>Les valeurs actualisées sont directement comparables entre elles, et deux placements sont équivalents quand leurs valeurs actualisées sont égales.</li>
<li>L’investisseur actualise pour comparer à son exigence de rentabilité. Le mécanisme traduit son exigence : il ne renonce à une consommation immédiate que s’il retient un certain taux de rentabilité.</li></ul>
<div class="formula">V<sub>0</sub> = V<sub>N</sub> / (1 + t)<sup>n</sup></div>
<h3>Exemple du cours</h3>
<p>Exigence de rentabilité ER = 11 % pour un flux de 110 :</p>
<div class="formula">11 % = (110 − X) / X&nbsp;→&nbsp;11 % = 110 / X − 1&nbsp;→&nbsp;1,11 = 110 / X&nbsp;→&nbsp;X = 110 / 1,11 ≈ 99,1 €</div>
<p>Autre exemple (document 1) : 5 000 / (1 + 0,06) = 4 716,98 (le document écrit 4 716).</p>`},
{id:11,t:"Valeur actuelle et valeur actuelle nette (VAN)",html:`
<p class="lead">Évaluer un titre : ce qu’il vaut aujourd’hui face à son prix de marché.</p>
<p>Posséder un titre financier, c’est posséder le droit de percevoir des cash flows (dividendes, etc.) qui s’écoulent dans le temps selon des modalités propres au titre acheté.</p>
<h3>Valeur actuelle d’un titre</h3>
<p>C’est la somme actualisée de ses flux futurs. Le titre a aussi un prix de marché V<sub>0</sub>.</p>
<div class="formula">VA = Σ F<sub>i</sub> / (1 + t)<sup>i</sup>&nbsp;&nbsp;&nbsp;VAN = VA − V<sub>0</sub> = Σ F<sub>i</sub> / (1 + t)<sup>i</sup> − V<sub>0</sub></div>
<div class="tablebox"><table><tr><th>VAN</th><th>Décision</th></tr>
<tr><td>VAN &gt; 0</td><td>Projet positif : on investit</td></tr>
<tr><td>VAN = 0</td><td>Projet neutre, pas de rentabilité supplémentaire : on arrive à la <b>valeur d’équilibre</b> du titre</td></tr>
<tr><td>VAN &lt; 0</td><td>Projet négatif : ne pas investir</td></tr></table></div>
<h3>À sa valeur d’équilibre</h3>
<p>Si un déséquilibre entre la VA et la valeur de marché se produit, les marchés s’emploient à rétablir l’équilibre et à rendre la VAN nulle. Ces opérations réduisent l’écart entre la VA et la valeur de marché, et <b>les arbitragistes y participent</b>. Sur un marché efficient à l’équilibre : <b>VAN = 0, VA = V<sub>0</sub></b>.</p>
<h3>Généralisation et portée de la VAN</h3>
<p>Tout actif, quelle que soit sa forme, génère une série de flux de trésorerie positifs et/ou négatifs. La VAN s’interprète de <b>trois manières</b> :</p>
<ol><li>Le <b>montant de la valeur créée</b> par un investissement : si l’investissement coûte 100 et que la VAN est de 10, l’investisseur s’enrichit de 10.</li>
<li>Le <b>montant supplémentaire maximal</b> que l’investisseur est prêt à payer pour réaliser cet investissement.</li>
<li>L’<b>écart</b> entre la VA et V<sub>0</sub> (la valeur de marché).</li></ol>
<h3>Exercice du cours : titre A</h3>
<p>Flux : année 1 : 5 000 ; année 2 : 4 000 ; année 3 : 5 000 ; année 4 : 4 000 ; année 5 : 5 000 + 100 000. Taux d’actualisation : 6 %. Valeur actuelle : 5 000 / 1,06 + 4 000 / 1,06² + 5 000 / 1,06³ + 4 000 / 1,06⁴ + 105 000 / 1,06⁵ ≈ <b>94 105,55 €</b> (calcul fait pour toi : le cours ne donne pas le résultat). La VAN s’obtient en retranchant le prix de marché du titre.</p>`},
{id:12,t:"Le taux de rentabilité actuariel (TRA)",html:`
<p class="lead">Le taux d’actualisation qui annule la VAN.</p>
<p>Il existe en général un taux d’actualisation qui annule la VAN : c’est le <b>taux de rentabilité actuariel (TRA)</b>. On cherche le taux t tel que VAN = 0.</p>
<div class="formula">Σ F<sub>i</sub> / (1 + t)<sup>i</sup> − V<sub>0</sub> = 0&nbsp;&nbsp;(on cherche t)</div>
<h3>Exemple du cours</h3>
<p>Instrument financier : V<sub>0</sub> = 2, flux annuel constant de 0,8 pendant 5 ans. Quel est son TRA ? On cherche t tel que 0,8 × (1/(1+t) + … + 1/(1+t)⁵) = 2. Résultat calculé pour toi : <b>t ≈ 28,65 %</b> (le cours ne donne pas la réponse).</p>
<h3>Le TRA comme critère de choix d’investissement</h3>
<ul><li>Le TRA est fréquemment utilisé sur les marchés financiers : il représente la rémunération de l’investisseur, qu’il peut comparer au taux de rentabilité qu’il exige.</li>
<li>Si <b>TRA &gt; taux de rentabilité exigé</b>, l’investisseur achète le titre. Un investissement dans un titre est rentable lorsque son TRA est <b>supérieur ou égal</b> au taux de rentabilité exigé.</li>
<li>À l’équilibre, dans une optique de marché efficient, le <b>TRA est identique au taux de rentabilité exigé</b>, qui est le taux de rentabilité du marché. La VAN est nulle.</li></ul>`},

/* ---------- données : cartes (id, chapitre, question, réponse) ---------- */
const CARDS=[
[1,1,"Comment est organisée l’évaluation ?","2 contrôles continus (40 %) : le 1er le 6 novembre (questions de cours, éventuellement petits exercices), le 2e à la dernière séance (épreuve pratique). 1 contrôle terminal (60 %) : examen sur ordinateur avec des données de marché."],
[2,1,"Quel est le double objectif de l’investisseur financier ?","1) Que le temps pendant lequel il prête ses fonds lui rapporte une rémunération (il renonce à les utiliser). 2) Que le risque pris lui rapporte une rémunération proportionnelle au risque."],
[3,1,"Qu’est-ce qu’une action ?","Une part de capital, un titre de propriété : l’investisseur est actionnaire (copropriétaire). Dividende variable, non garanti, et plus-value éventuelle. Risque élevé : remboursé en dernier, peut perdre toute sa mise."],
[4,1,"Qu’est-ce qu’une obligation ?","Un titre de créance (dette) : l’investisseur est créancier, sans part de la société. Rémunération fixe ou variable (indexée) : coupons versés régulièrement, capital remboursé à l’échéance. Risque modéré à faible, prioritaire sur l’action."],
[5,1,"Qui sont les AEE et les AEBF, et quel est leur lien ?","Agents économiques excédentaires (qui ont de l’épargne, souvent les ménages) et déficitaires (entreprises, État). Le système financier les met en relation : AEE > SF > AEBF."],
[6,2,"Qu’est-ce que la finance directe ?","Les agents excédentaires financent directement ceux qui ont besoin de financement. Le système financier sert de courtier (mise en relation). C’est la finance des marchés financiers : financement contractuellement direct."],
[7,2,"Qu’est-ce que la finance indirecte ?","La finance intermédiée par le système bancaire. La banque sert d’écran entre demandeurs et pourvoyeurs de capitaux : pas de relation contractuelle entre eux. Elle opère une transformation (ressources court terme, emplois long terme)."],
[8,2,"Quels sont les intermédiaires de la finance directe ?","CIF (conseiller en investissements financiers), EI, PSI (services d’investissement, exécution d’ordres), dont les banques dans leur fonction de conseil, non de financement."],
[9,2,"Que montre le bilan d’un intermédiaire financier (courtier) ?","Rien : il n’accorde pas de financement et ne collecte pas de ressources. Seule sa rémunération (commission) apparaît dans son compte de résultat."],
[10,2,"Que contient le bilan d’une banque qui fait de l’intermédiation ?","À l’actif : les emplois (portefeuille d’actions, crédits…). Au passif : les ressources collectées auprès des clients ou empruntées à la banque centrale, et la dette émise."],
[11,2,"Comment calcule-t-on la marge d’intermédiation ?","Taux de rémunération des emplois − coût des ressources. Exemple : emplois 12 / 100 = 12 %, ressources 10 / 100 = 10 % : marge = 2 %."],
[12,2,"Qu’est-ce que la désintermédiation ?","Une part de plus en plus importante du financement des entreprises se fait directement sur les marchés financiers, en Europe notamment, plutôt que par les banques."],
[13,2,"Qu’est-ce qu’une économie d’endettement ?","Marchés financiers peu développés : entreprises fortement endettées auprès des banques, elles-mêmes endettées auprès de la banque centrale. Risque de bilan et de solvabilité, effet boule de neige sur la banque."],
[14,2,"Quel risque dans une économie de marché ?","Le risque sur la valeur du titre : la volatilité du titre."],
[15,2,"Courtage ou intermédiation : exemple d’un prêt de 10 M€ à 5 % ?","En courtage la banque ne perd que sa rémunération (500 K€) ; en intermédiation elle risquerait 10 M€."],
[16,2,"Qu’est-ce qu’un OPCVM ?","SICAV ou FCP : la banque conçoit l’OPCVM, le dote d’actifs (actions, obligations) et émet des parts. Uniquement en actions : OPCVM dynamique."],
[17,2,"Qui a théorisé la distinction finance directe / indirecte ? Et Hicks ?","Gurley et Shaw. Hicks : économie de marchés financiers."],
[18,2,"Qu’est-ce que la marchéisation ?","Le marché financier influence les prix proposés par les banques (crédits aux ménages et PME) : la banque doit s’aligner sur les prix des marchés pour ne pas perdre ses clients."],
[19,2,"Qu’est-ce que l’ALM et quels sont ses trois objectifs ?","Asset and Liability Management : piloter actifs et passifs. 1) Gérer les risques de taux et de liquidité. 2) Éviter le décalage de maturité. 3) Optimiser la rentabilité en équilibrant risque et solvabilité (accords de Bâle)."],
[20,3,"Marché primaire : définition et intérêt pour l’entreprise ?","Marché de l’émission, de la création des titres. L’entreprise reçoit du cash (new money) : c’est là qu’elle se finance."],
[21,3,"Marché secondaire : définition ?","Marché des transactions ultérieures à l’émission, « marché de l’occasion ». Simple changement de propriétaire, sans cash pour l’entreprise. Assure valorisation, cotation et liquidité."],
[22,3,"Pourquoi le marché secondaire est-il un jeu à somme nulle ?","Entre investisseurs : l’un achète ce que l’autre vend, indépendamment de l’émetteur. Il ne finance pas le développement économique mais refinance les investissements initiaux."],
[23,3,"Quelle est la seule sortie d’un actionnaire ?","Vendre son action à un autre investisseur intéressé. La sortie est plus aisée pour un titre à court terme."],
[24,3,"Qu’est-ce qu’un produit dérivé ?","Un produit dont la valeur dépend d’un autre actif, le sous-jacent (actions, obligations, matières premières…). Deux familles : contrats à terme et options. Marché sur un marché."],
[25,3,"Qu’est-ce que l’effet de levier d’un dérivé ?","Une mise de fonds limitée permet de prendre une position bien plus importante sur le sous-jacent."],
[26,3,"Contrat à terme ou option : quelle différence ?","Contrat à terme : engagement ferme d’acheter ou de vendre à l’échéance à un prix fixé. Option : un droit (acquérir ou vendre une quantité à une date), pas une obligation."],
[27,3,"Exemple de couverture par contrat à terme ?","Un producteur de blé vend aujourd’hui un contrat à terme à un prix fixé : si le prix baisse, le contrat compense sa perte ; si le prix monte il ne profite pas de la hausse, mais son chiffre d’affaires est sécurisé."],
[28,3,"Exemple de spéculation par contrat à terme ?","Un investisseur anticipe la hausse du pétrole, achète un contrat à terme sans posséder de baril, et le revend plus cher avant l’échéance."],
[29,4,"Quels sont les objectifs d’un système financier ?","Fournir des liquidités aux projets d’investissement les plus rentables en fonction des risques anticipés. Deux notions : rentabilité et risque."],
[30,4,"Qui a défini les six fonctions du système financier ?","Merton et Bodie."],
[31,4,"Fonction 1 et 2 du système financier ?","1) Faciliter les transactions (règlement et compensation : chèque, carte…). 2) Mettre en commun des fonds pour de grands projets et subdiviser le capital des entreprises (diversification)."],
[32,4,"Fonction 3 et 4 du système financier ?","3) Répartir les ressources dans le temps, l’espace et entre secteurs (jeunes ménages qui empruntent, retraités qui épargnent). 4) Fournir des outils de gestion du risque (épargne collective, diversification)."],
[33,4,"Fonction 5 et 6 du système financier ?","5) Information sur les prix au plus bas coût. 6) Limiter les problèmes entre parties d’un contrat (asymétrie d’information) : discipline de marché, alignement d’intérêts."],
[34,5,"Banque commerciale ou banque d’affaires ?","Commerciale : collecte des ressources auprès des clients et prête. D’affaires : conseil (fusions-acquisitions), intermédiaire pour le placement d’instruments financiers, sans toucher à son bilan."],
[35,5,"Qu’est-ce qu’une banque universelle ?","Un groupe issu du rapprochement de banques commerciales et d’affaires : BNP et Paribas, JP Morgan et Chase Manhattan, Bank of America et Merrill Lynch."],
[36,5,"Qu’était le Glass-Steagall Act ?","Loi américaine qui interdisait le rapprochement banques commerciales / banques d’affaires. Abrogée en 1999, ce qui a favorisé les banques universelles."],
[37,5,"Quelle conséquence de la crise de 2008 pour les banques ?","Volonté politique de séparer à nouveau dépôts et marchés pour protéger les épargnants : les activités spéculatives de compte propre sont cantonnées dans des structures différentes."],
[38,5,"Quels sont les trois départements des groupes bancaires ?","Banque de détail, banque de financement et d’investissement (BFI), gestion d’actifs."],
[39,5,"Caractéristiques de la banque de détail ?","Particuliers, pros, PME ; intermédiation financière ; millions de clients, dimension quasi industrielle ; produits standardisés ; diversification du risque ; très concurrentielle, marges faibles après frais généraux et coût du risque."],
[40,5,"Qu’est-ce que le coût du risque ?","Les provisions que la banque doit faire en prévision des créances douteuses."],
[41,5,"Affacturage et crédit-bail ?","Affacturage : cession de créances à un factor qui paie la créance. Crédit-bail : service spécialisé proposé aux PME. Tous deux dans la banque de détail."],
[42,5,"Caractéristiques de la BFI ?","Le département le plus rentable : services sophistiqués, sur mesure, pour quelques milliers de grandes entreprises (ex. BNP Paribas CIB, CACIB)."],
[43,5,"ECM, DCM, M&A ?","ECM (Equity Capital Market) : introduction en bourse, augmentations de capital, OCA. DCM (Debt Capital Market) : émission d’obligations. M&A : conseil en fusion-acquisition, conseil de valorisation, pas du financement."],
[44,5,"Qu’est-ce qu’un crédit syndiqué ?","Un financement important réalisé par plusieurs établissements, avec un chef de file. Exemple : BNP 50 %, CA 25 %, CE 25 %."],
[45,5,"Que fait la gestion d’actifs ?","Clients : investisseurs institutionnels (assureurs), family offices, particuliers fortunés. Produits : SICAV, FCP, produits structurés. Elle recourt à la BFI pour des instruments de couverture."],
[46,5,"Donne des exemples d’acteurs spécialisés.","Conseil en fusion-acquisition : Lazard, Rothschild, Hottinger. Néobanque : Revolut. Banque régionale : Crédit Mutuel Arkéa."],
[47,5,"Quel est le métier de base des banques ?","Apprécier le risque et le repackager, en éliminant le risque qui peut être diversifié. Elles sont aussi un indicateur d’aversion au risque (crises de 2008 et de 2020)."],
[48,6,"Qu’est-ce qu’un marché efficient ?","Un marché où les prix des titres reflètent à tout instant toute l’information pertinente disponible. Aussi appelé marché à l’équilibre ou marché parfait."],
[49,6,"Pourquoi parle-t-on de marche au hasard ?","Seule une information nouvelle totalement imprévue modifie le prix. Son apparition étant imprévisible, les variations de prix sont aléatoires (processus stochastique)."],
[50,6,"Qui est Eugène Fama ?","Économiste de l’université de Chicago à l’origine de la théorie des marchés efficients, prix Nobel d’économie en 2013. Trois niveaux d’efficience."],
[51,6,"Forme faible de l’efficience ?","Les prix intègrent les données historiques. L’analyse technique est inutile."],
[52,6,"Forme semi-forte de l’efficience ?","Les prix intègrent les données historiques et publiques. Analyse technique et fondamentale inutiles. Aucun effet sur le prix avant l’annonce, ni au lendemain."],
[53,6,"Forme forte de l’efficience ?","Les prix intègrent aussi les informations privées ou privilégiées : même les initiés ne peuvent pas faire mieux que le marché. Vrai si les autorités répriment le délit d’initié."],
[54,7,"Quelles anomalies Thaler et Kahneman ont-ils mises en évidence ?","Volatilité et instabilité des cours (bruit autour de la valeur fondamentale), dual listing (sociétés jumelles à cours différents), anomalies calendaires (lundi, janvier), anomalie météorologique."],
[55,7,"Quelles sont les quatre catégories d’anomalies ?","Fondamentales (taille, valeur), techniques (momentum, retour à la moyenne), calendaires (janvier, lundi), comportementales (sur et sous-réaction, bulles)."],
[56,7,"Effet taille et effet valeur ?","Taille : les small caps rapportent plus que les large caps, même ajusté du risque. Valeur : les actions décotées (faible PER, fort Book-to-Market) surperforment les actions de croissance."],
[57,7,"Effet momentum ?","Jegadeesh et Titman, 1993 : à 3-12 mois, les gagnants continuent de gagner et les perdants de baisser. Contredit la forme faible."],
[58,7,"Retour à la moyenne ?","De Bondt et Thaler, 1985 : à 3-5 ans, les portefeuilles perdants finissent par surperformer les gagnants (correction d’une réaction excessive)."],
[59,7,"Effet janvier et effet week-end ?","Janvier : rendements anormalement élevés (surtout petites capitalisations), expliqués par des ventes fiscales en décembre puis des rachats. Week-end ou lundi : rendements du lundi souvent inférieurs, parfois négatifs."],
[60,7,"Sur-réaction, sous-réaction, bulles ?","Sur-réaction aux mauvaises nouvelles (krachs injustifiés), sous-réaction aux résultats réguliers (fenêtres d’arbitrage). Bulles : exemple de la bulle internet des années 2000, « exubérance irrationnelle »."],
[61,7,"Quel biais face au gain et à la perte ?","Les investisseurs assurent un gain certain (50 sûrs plutôt qu’une chance sur deux d’obtenir 100), mais prennent des risques quand la probabilité de perte est forte."],
[62,7,"Les trois mimétismes d’André Orléan ?","Normatif (conformisme), informationnel (imiter ceux supposés mieux informés), autoréférentiel (prévoir le comportement majoritaire pour l’imiter) : prophétie autoréalisatrice et bulles."],
[63,7,"Qu’est-ce que le program trading ?","Décisions préprogrammées dans les logiciels d’achat et de cession automatiques, qui accentuent le mimétisme."],
[64,7,"Que s’est-il passé le 2 mai 2022 à Stockholm ?","Flash crash : l’indice chute de plus de 8 % en quelques minutes, à cause d’une erreur d’un opérateur d’une grande banque américaine (fat finger)."],
[65,8,"Qu’est-ce que la couverture ?","Se protéger contre un risque (hedge). Choisir un investissement long terme pour couvrir un financement long terme : adossement des maturités."],
[66,8,"Qu’est-ce que la spéculation ?","Accepter un risque : prendre position, parier sur l’évolution future du prix d’un actif, sans en tirer de revenu régulier. Le spéculateur transforme les échéances : rôle utile."],
[67,8,"Qu’est-ce que l’arbitrage ?","Pas de risque ni d’avis spéculatif : tirer parti des écarts de prix d’un même titre entre marchés. Il apporte liquidité, égalité des prix et efficience."],
[68,8,"Limites de l’arbitrage ?","Shleifer et Vishny, 1997 : l’arbitragiste est théoriquement le garant de l’efficience, mais son pouvoir n’est pas absolu. Les algorithmes rendent l’arbitrage plus rare et complexe."],
[69,9,"Pourquoi un euro aujourd’hui vaut-il plus qu’un euro demain ?","L’achat d’un titre est un acte intéressé : on renonce à une satisfaction immédiate, d’où une exigence de rentabilité. Il existe un taux d’intérêt de l’argent même sans risque."],
[70,9,"Formules de la capitalisation ?","VN = V0 × (1 + t)ⁿ et t = (VN / V0)^(1/n) − 1. Croissance exponentielle, pas linéaire."],
[71,9,"100 000 € en 2013 deviennent 1,8 M€ en 10 ans : quel taux annuel ?","(1 + i)¹⁰ = 18, donc i = 18^(1/10) − 1 ≈ 33,5 %. Diviser la plus-value (1 700 %) par 10 serait faux : les revenus sont capitalisés."],
[72,9,"Quelle hypothèse sur les flux dans la capitalisation ?","Ils sont réinvestis au même taux. Seuls comptent les flux de trésorerie effectifs, au moment où ils sont touchés, pas acquis."],
[73,9,"Quel taux pour doubler un capital en 10 ans ?","7,177 % par an : 2^(1/10) − 1."],
[74,10,"Qu’est-ce que l’actualisation ?","Chercher la valeur d’aujourd’hui d’une somme future, en la dépréciant par un coefficient inférieur à 1. Elle permet de comparer des flux à des dates différentes."],
[75,10,"Formule de l’actualisation ?","V0 = VN / (1 + t)ⁿ."],
[76,10,"110 € dans un an avec 11 % d’exigence : prix maximal ?","110 / 1,11 ≈ 99,1 €."],
[77,11,"Définition de la VA et de la VAN ?","VA = Σ Fi / (1 + t)ⁱ : somme actualisée des flux futurs. VAN = VA − V0 (valeur de marché)."],
[78,11,"Comment décide-t-on avec la VAN ?","VAN > 0 : projet positif, on investit. VAN = 0 : neutre, valeur d’équilibre. VAN < 0 : on n’investit pas."],
[79,11,"Que vaut la VAN à l’équilibre d’un marché efficient ?","Zéro : VA = V0. Les marchés, avec les arbitragistes, rétablissent l’équilibre."],
[80,11,"Les trois interprétations de la VAN ?","1) Valeur créée par l’investissement (coût 100, VAN 10 : on s’enrichit de 10). 2) Supplément maximal que l’investisseur accepte de payer. 3) Écart entre la VA et la valeur de marché V0."],
[81,12,"Qu’est-ce que le TRA ?","Taux de rentabilité actuariel : le taux d’actualisation qui annule la VAN. On cherche t tel que Σ Fi / (1 + t)ⁱ − V0 = 0."],
[82,12,"Comment utilise-t-on le TRA pour décider ?","Si TRA ≥ rentabilité exigée, l’investisseur achète. À l’équilibre d’un marché efficient, TRA = rentabilité exigée du marché, VAN nulle."],
[83,12,"TRA : V0 = 2, flux de 0,8 pendant 5 ans ?","Environ 28,65 % par an."],
[84,13,"Quelle date : abrogation du Glass-Steagall ?","1999."],
[85,13,"Dates : 1985, 1993, 1997 ?","1985 De Bondt et Thaler (retour à la moyenne) ; 1993 Jegadeesh et Titman (momentum) ; 1997 Shleifer et Vishny (limites de l’arbitrage)."],
[86,13,"Dates : 2008, 2013, 2020, 2022 ?","2008 crise financière ; 2013 Nobel de Fama ; 2020 crise sanitaire ; 2 mai 2022 flash crash de Stockholm."]
].map(([id,ch,q,a])=>({id,ch,q,a}));

const EXOS=[
{ch:9,t:"Capitalisation",make(){
  const V0=pick([10000,20000,50000]),t=pick([3,4,5,6,8]),n=pick([3,4,5,6,8,10]);
  const Vn=V0*Math.pow(1+t/100,n);
  return {text:`On place ${fr(V0)} € à ${t} % par an, intérêts capitalisés, pendant ${n} ans.`,
    fields:[{label:"Capital final",ans:Vn,tol:1,unit:"€",d:2}],
    sol:`VN = V0 × (1 + t)ⁿ`,calc:`${fr(V0)} × 1,${String(t).padStart(2,"0")}^${n} = ${frFix(Vn)} €`};}},
{ch:9,t:"Taux de rentabilité annuel",make(){
  const V0=pick([50000,100000,200000]),k=pick([1.6,1.8,2,2.5,3]),n=pick([4,5,8,10]);
  const Vn=V0*k,t=(Math.pow(Vn/V0,1/n)-1)*100;
  return {text:`Un capital de ${fr(V0)} € vaut ${fr(Vn)} € après ${n} ans, sans apport ni dividende. Quel est le taux annuel ?`,
    fields:[{label:"Taux annuel",ans:t,tol:.1,unit:"%",d:2}],
    sol:`t = (VN / V0)^(1/n) − 1`,calc:`(${fr(Vn)} / ${fr(V0)})^(1/${n}) − 1 = ${frFix(t)} %`};}},
{ch:9,t:"Doubler son capital",make(){
  const n=pick([5,8,10,12,15]);const t=(Math.pow(2,1/n)-1)*100;
  return {text:`Quel taux annuel faut-il pour doubler un capital en ${n} ans ?`,
    fields:[{label:"Taux annuel",ans:t,tol:.02,unit:"%",d:3}],
    sol:`t = 2^(1/n) − 1`,calc:`2^(1/${n}) − 1 = ${frFix(t,3)} %`};}},
{ch:10,t:"Actualisation",make(){
  const Vn=pick([5000,10000,20000]),t=pick([4,5,6,8,9]),n=pick([2,3,4,5,6]);
  const V0=Vn/Math.pow(1+t/100,n);
  return {text:`Un investissement versera ${fr(Vn)} € dans ${n} ans. La rentabilité exigée est de ${t} %. Quel prix maximal payer aujourd’hui ?`,
    fields:[{label:"Valeur actuelle",ans:V0,tol:1,unit:"€",d:2}],
    sol:`V0 = VN / (1 + t)ⁿ`,calc:`${fr(Vn)} / 1,${String(t).padStart(2,"0")}^${n} = ${frFix(V0)} €`};}},
{ch:10,t:"Exigence de rentabilité",make(){
  const F=pick([110,120,105,200]),er=pick([8,10,11,12]);
  const X=F/(1+er/100);
  return {text:`Un flux de ${F} € sera perçu dans un an. L’investisseur exige ${er} %. Quel prix maximal accepte-t-il aujourd’hui ?`,
    fields:[{label:"Prix maximal",ans:X,tol:.05,unit:"€",d:2}],
    sol:`ER = (F − X) / X, donc X = F / (1 + ER)`,calc:`${F} / 1,${String(er).padStart(2,"0")} = ${frFix(X)} €`};}},
{ch:11,t:"VA, VAN et décision",make(){
  const F=[pick([3000,4000,5000]),pick([4000,5000,6000]),pick([100000,105000,110000])],t=pick([5,6,7,8]);
  const VA=F[0]/(1+t/100)+F[1]/Math.pow(1+t/100,2)+F[2]/Math.pow(1+t/100,3);
  const V0=Math.round(VA/1000)*1000+pick([-3000,2000,4000]);
  const VAN=VA-V0;
  return {text:`Un titre verse ${fr(F[0])} €, ${fr(F[1])} € puis ${fr(F[2])} € aux années 1, 2 et 3. Il coûte ${fr(V0)} € et la rentabilité exigée est de ${t} %.`,
    fields:[{label:"Valeur actuelle (VA)",ans:VA,tol:2,unit:"€",d:2},{label:"VAN",ans:VAN,tol:2,unit:"€",d:2},{label:"Investir ? (1 = oui, 0 = non)",ans:VAN>0?1:0,tol:0,unit:"",d:0}],
    sol:`VA = Σ Fi / (1 + t)ⁱ puis VAN = VA − V0. On investit si la VAN est positive.`,calc:`VA = ${frFix(VA)} €, VAN = ${frFix(VAN)} €`};}},
{ch:11,t:"Titre A du cours",make(){
  const t=pick([6,6,5,7]);const F=[5000,4000,5000,4000,105000];
  const VA=F.reduce((s,x,i)=>s+x/Math.pow(1+t/100,i+1),0);
  return {text:`Titre A : flux de 5 000, 4 000, 5 000, 4 000 puis 5 000 + 100 000 aux années 1 à 5. Taux d’actualisation : ${t} %. Calcule la valeur actuelle.`,
    fields:[{label:"Valeur actuelle (VA)",ans:VA,tol:2,unit:"€",d:2}],
    sol:`VA = Σ Fi / (1 + t)ⁱ`,calc:`VA = ${frFix(VA)} €`};}},
{ch:12,t:"TRA d’un zéro-coupon",make(){
  const P=pick([80,85,90,95]),n=pick([2,3,4,5]),F=100;
  const t=(Math.pow(F/P,1/n)-1)*100;
  return {text:`Un titre coûte ${P} € et rembourse ${F} € dans ${n} ans, sans coupon. Quel est son TRA ?`,
    fields:[{label:"TRA",ans:t,tol:.1,unit:"%",d:2}],
    sol:`On cherche t tel que P = F / (1 + t)ⁿ, soit t = (F / P)^(1/n) − 1`,calc:`(${F} / ${P})^(1/${n}) − 1 = ${frFix(t)} %`};}},
{ch:12,t:"TRA et décision d’achat",make(){
  const V0=pick([90,95,100]),F=pick([105,110,115]),er=pick([4,5,6,8,10]);
  const t=(F/V0-1)*100,ok=t>=er;
  return {text:`Un titre coûte ${V0} € et rapportera ${F} € dans un an (un seul flux). L’investisseur exige ${er} %. Quel est le TRA ? Faut-il acheter ?`,
    fields:[{label:"TRA",ans:t,tol:.05,unit:"%",d:2},{label:"Acheter ? (1 = oui, 0 = non)",ans:ok?1:0,tol:0,unit:"",d:0}],
    sol:`TRA = F / V0 − 1. On achète si TRA ≥ rentabilité exigée.`,calc:`${F} / ${V0} − 1 = ${frFix(t)} %, ${ok?"supérieur ou égal":"inférieur"} à ${er} %`};}},
{ch:2,t:"Marge d’intermédiation",make(){
  const r=pick([2,3,4,5]),m=pick([1.5,2,2.5,3]),e=r+m,enc=pick([50,100,200]);
  return {text:`Une banque collecte ${enc} M€ de ressources à ${fr(r)} % et les prête à ${fr(e)} %.`,
    fields:[{label:"Marge d’intermédiation",ans:m,tol:.01,unit:"%",d:2},{label:"Marge annuelle",ans:enc*m/100,tol:.01,unit:"M€",d:2}],
    sol:`marge = taux des emplois − coût des ressources`,calc:`${fr(e)} % − ${fr(r)} % = ${fr(m)} %, soit ${fr(enc)} × ${fr(m)} % = ${fr(enc*m/100)} M€`};}},
{ch:2,t:"Courtage ou intermédiation",make(){
  const M=pick([5,10,20,50]),t=pick([3,4,5,6]);
  return {text:`Un prêt de ${M} M€ à ${t} % n’est pas remboursé. Quelle perte pour la banque en courtage ? Et en intermédiation financière (en M€) ?`,
    fields:[{label:"Perte en courtage (M€)",ans:M*t/100,tol:.01,unit:"M€",d:2},{label:"Perte en intermédiation (M€)",ans:M,tol:.01,unit:"M€",d:2}],
    sol:`Courtage : la banque ne perd que sa rémunération. Intermédiation : elle perd le capital prêté.`,calc:`${M} × ${t} % = ${fr(M*t/100)} M€ contre ${M} M€`};}}
];

function chapSelect(id,val){return `<select id="${id}" aria-label="Chapitre"><option value="all">Tous les chapitres</option>${CH.map(x=>`<option value="${x.id}" ${String(x.id)===val?"selected":""}>${x.id}. ${esc(x.t)}</option>`).join("")}</select>`}
function renderQcm(){

    <p class="qtext">${esc(q.q)}</p>
    <div class="opts">${q._o.map((o,k)=>`<button class="opt ${answered?(o.ok?"good":(qz.chosen===k?"bad":"")):""}" data-k="${k}" ${answered?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>
    ${answered?`<div class="explain"><span class="verdict ${q._o[qz.chosen].ok?"good":"bad"}">${q._o[qz.chosen].ok?"Bonne réponse.":"Pas tout à fait."}</span> ${esc(q.e)}</div>
    <div style="margin-top:14px"><button class="btn primary" id="q-next">${qz.i+1<qz.pool.length?"Question suivante":"Voir le score"}</button></div>`:""}
  </div>`;
  bindQcmTop();
  b.querySelectorAll(".opt").forEach(btn=>btn.onclick=()=>{
    const k=+btn.dataset.k;qz.chosen=k;if(q._o[k].ok){qz.score++;ev.qcm[q.q]=1;saveEv()}renderQcm();

      if(qz.best[qz.ch]==null||pct>qz.best[qz.ch]){qz.best[qz.ch]=pct;store.set("best",qz.best)}renderStats()}
    renderQcm();
  };
}

const ev={qcm:store.get("evq",{}),exo:store.get("evx",{}),self:store.get("evs",{}),mock:store.get("evm",[])};
function saveEv(){store.set("evq",ev.qcm);store.set("evx",ev.exo);store.set("evs",ev.self);store.set("evm",ev.mock)}
const LEVELS=[[0,"Débutant"],[25,"En progression"],[50,"Intermédiaire"],[70,"Avancé"],[88,"Expert"]];
const lvl=p=>LEVELS.filter(l=>p>=l[0]).pop()[1];
function chapStats(c){
  const cards=CARDS.filter(x=>x.ch===c.id),qs=QCM.filter(x=>x.ch===c.id),xs=EXOS.filter(x=>x.ch===c.id);
  const parts=[];
  parts.push({k:"Lu",v:cours.read[c.id]?1:0,n:"cours"});
  if(cards.length)parts.push({k:"Cartes sues",v:cards.filter(x=>fc.known[x.id]).length/cards.length,n:cards.filter(x=>fc.known[x.id]).length+"/"+cards.length});
  if(qs.length)parts.push({k:"QCM réussis",v:qs.filter(x=>ev.qcm[x.q]).length/qs.length,n:qs.filter(x=>ev.qcm[x.q]).length+"/"+qs.length});
  if(xs.length)parts.push({k:"Exercices réussis",v:xs.filter(x=>ev.exo[x.t]).length/xs.length,n:xs.filter(x=>ev.exo[x.t]).length+"/"+xs.length});
  const pct=Math.round(parts.reduce((s,p)=>s+p.v,0)/parts.length*100);
  return {parts,pct};
}
function points(){
  const read=CH.filter(c=>cours.read[c.id]).length*10;
  const cards=CARDS.filter(x=>fc.known[x.id]).length*2;
  const q=Object.keys(ev.qcm).length*5;
  const x=Object.values(ev.exo).reduce((s,n)=>s+Math.min(n,3)*10,0);
  const m=ev.mock.length?Math.max(...ev.mock.map(r=>r.note))*5:0;
  const max=CH.length*10+CARDS.length*2+QCM.length*5+EXOS.length*30+100;
  return {read,cards,q,x,m,total:read+cards+q+x+m,max};
}

const mock={on:false,pool:[],i:0,score:0,chosen:null,done:false,t0:0,tick:null,wrong:[]};

const fmtT=ms=>{const s=Math.floor(ms/1000);return Math.floor(s/60)+" min "+String(s%60).padStart(2,"0")+" s"};

  <div class="evpts"><span>Cours lus <b class="num">${P.read}</b></span><span>Cartes sues <b class="num">${P.cards}</b></span><span>QCM <b class="num">${P.q}</b></span><span>Exercices <b class="num">${P.x}</b></span><span>Examen blanc <b class="num">${P.m}</b></span></div>
  <p class="stat" style="margin-top:6px">Barème : 10 pts par chapitre lu, 2 par carte sue, 5 par QCM réussi (une fois), 10 par exercice juste (3 fois maximum), 5 × la meilleure note à l’examen blanc.</p>
  <h3 style="margin-top:28px">Mes chapitres</h3><p class="lead">Note objective (mesurée) et auto-évaluation (ton ressenti). Un écart signale un chapitre à retravailler.</p><div class="evlist">`;
  stats.forEach(({c,s})=>{
    const sv=ev.self[c.id],warn=sv==="haut"&&s.pct<50?"Tu te sens sûr, mais les résultats disent le contraire : reviens dessus.":sv==="bas"&&s.pct>=70?"Tu doutes, mais tes résultats sont bons.":"";
    h+=`<div class="evrow"><div class="evh"><b>${c.id}. ${esc(c.t)}</b><span class="num">${s.pct} % · ${lvl(s.pct)}</span></div>
    <div class="progress" style="max-width:none"><i style="width:${s.pct}%"></i></div>
    <div class="evd">${s.parts.map(p=>`<span>${p.k}${p.k==="Lu"?" : "+(p.v?"oui":"non"):" : "+p.n}</span>`).join("")}</div>
    <div class="row" role="group" aria-label="Auto-évaluation chapitre ${c.id}"><span class="stat">Mon ressenti :</span>${SELF.map(([k,t])=>`<button class="btn ${sv===k?"primary":"ghost"}" data-self="${c.id}:${k}">${t}</button>`).join("")}<button class="btn ghost" data-open="${c.id}">Réviser</button></div>
    ${warn?`<div class="explain">${warn}</div>`:""}</div>`;
  });
  h+=`</div><h3 style="margin-top:28px">Examen blanc</h3><div id="ev-mock"></div>`;
  if(ev.mock.length)h+=`<h3 style="margin-top:28px">Historique</h3><div class="evd" style="gap:8px">${ev.mock.slice(-8).reverse().map(r=>`<span class="chip2">${r.date} · <b class="num">${fr(r.note,1)} / 20</b> · ${r.dur}</span>`).join("")}</div><div style="margin-top:10px"><button class="btn ghost" id="ev-reset">Réinitialiser toute l’évaluation</button></div>`;
  el.innerHTML=h;renderMock();
  el.querySelectorAll("[data-self]").forEach(b=>b.onclick=()=>{const[c,k]=b.dataset.self.split(":");ev.self[c]=ev.self[c]===k?undefined:k;saveEv();renderEval()});
  el.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{cours.cur=+b.dataset.open;store.set("chap",cours.cur);renderCours();go("cours")});
  const rs=$("#ev-reset");if(rs)rs.onclick=()=>{if(rs.dataset.sure){ev.qcm={};ev.exo={};ev.self={};ev.mock=[];saveEv();renderEval()}else{rs.dataset.sure=1;rs.textContent="Confirmer : effacer points, notes et historique"}};
}
function renderMock(){
  const b=$("#ev-mock");if(!b)return;
  if(!mock.on){b.innerHTML=`<div class="qbox"><p style="margin:0 0 12px">20 questions tirées au hasard dans tous les chapitres, sans correction pendant l’épreuve, chronométrées. Note finale sur 20, avec la liste des erreurs à revoir.</p><button class="btn primary" id="m-go">Lancer l’examen blanc</button></div>`;$("#m-go").onclick=()=>{mockStart();renderMock()};return}
  if(mock.done){
    const note=Math.round(mock.score/mock.pool.length*20*10)/10,dur=fmtT(mock.end-mock.t0);
    b.innerHTML=`<div class="qbox"><p class="stat">Terminé en ${dur}</p><div class="score num">${fr(note,1)} / 20</div><p>${note>=16?"Très bien : tu es prêt.":note>=12?"Bien, il reste quelques points à consolider.":note>=10?"Moyen : retravaille les chapitres ci-dessous.":"Insuffisant pour l’instant : reprends le cours et les cartes."}</p>
    ${mock.wrong.length?`<p><b>À revoir :</b></p>${mock.wrong.map(q=>`<div class="explain" style="margin-bottom:8px"><b>Ch. ${q.ch} · ${esc(q.q)}</b><br>Réponse : ${esc(q.o[q.a])}. ${esc(q.e)}</div>`).join("")}`:"<p>Aucune erreur.</p>"}
    <button class="btn primary" id="m-go">Nouvel examen blanc</button></div>`;$("#m-go").onclick=()=>{mockStart();renderMock()};return}
  const q=mock.pool[mock.i],ans=mock.chosen!==null;
  b.innerHTML=`<div class="qbox"><div class="qmeta"><span>Question ${mock.i+1} sur ${mock.pool.length}</span><span class="num" id="m-t"></span></div>
  <p class="qtext">${esc(q.q)}</p><div class="opts">${q._o.map((o,k)=>`<button class="opt ${ans&&mock.chosen===k?"good":""}" data-k="${k}" ${ans?"disabled":""}>${esc(o.t)}</button>`).join("")}</div>
  ${ans?`<div style="margin-top:14px"><button class="btn primary" id="m-next">${mock.i+1<mock.pool.length?"Question suivante":"Terminer et voir la note"}</button></div>`:""}</div>`;
  const tick=()=>{const t=$("#m-t");if(t)t.textContent=fmtT(Date.now()-mock.t0)};tick();mock.tick=setInterval(tick,1000);
  b.querySelectorAll(".opt").forEach(x=>x.onclick=()=>{mock.chosen=+x.dataset.k;if(q._o[mock.chosen].ok){mock.score++;ev.qcm[q.q]=1}else mock.wrong.push(q);renderMock()});
  const nx=$("#m-next");if(nx)nx.onclick=()=>{
    if(mock.i+1<mock.pool.length){mock.i++;mock.chosen=null}else{
      mock.done=true;mock.end=Date.now();clearInterval(mock.tick);
      const note=Math.round(mock.score/mock.pool.length*20*10)/10;
      ev.mock.push({note,date:new Date().toLocaleDateString("fr-FR"),dur:fmtT(mock.end-mock.t0)});saveEv();renderEval();return}
    renderMock()};
}
function renderStats(){if(!$("#view-evaluation").hidden)renderEval()}

/* ---------- init ---------- */
renderCours();
fc.build();renderCards();
qz.start();renderQuiz();
showView(location.hash.slice(1)||store.get("view","cours"));
</script>
